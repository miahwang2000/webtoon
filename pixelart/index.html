<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>픽셀아트 클래스</title>
<!--
  픽셀 아트 메이커 MVP
  -----------------------------------------------------------
  - 학생 이름/반 선택 -> 수업 시작하기 -> 전체화면(kiosk) 진입
  - classroom-input-guard.js 는 기존 앱들과 동일한 공용 유틸리티를 그대로 재사용합니다.
    (파일 이름/경로가 다르면 아래 <script src="classroom-input-guard.js"> 한 줄만 맞춰주세요)
  - 가이드 이미지: guides/ 폴더에 파일을 넣어주세요. 파일명 규칙:
      16으로 시작 = 초급(16×16), 26으로 시작 = 중급(26×26), 36으로 시작 = 고급(36×36)
      예) guides/16_guide1.png, guides/26_guide1.png, guides/36_tiger01.png
    (파일이 아직 없으면 회색 안내 박스로 대체 표시됩니다)
  - 저장: localStorage 자동 저장 (반+이름 별로 구분)
  - 제출: Cloudinary unsigned upload (cloud_name: qmbonapf, upload_preset: stickman)
          폴더: pixelart/{반}, context: student={이름}
          대표 프레임 1장만 PNG로 업로드, 나머지 프레임은 localStorage 에만 보관
  -----------------------------------------------------------
-->
<script src="classroom-input-guard.js" defer></script>
<style>
:root{
  --paper:#fbf7ee;
  --grid-line:#e4d9c4;
  --ink:#2c2a26;
  --accent:#ff8a3d;   /* 픽셀 오렌지 */
  --accent2:#3ec6a8;  /* 픽셀 민트 */
  --accent3:#5b7fd1;  /* 픽셀 블루 */
  --panel:#ffffff;
  --panel-border:#2c2a26;
  --danger:#e0524a;
}
*{box-sizing:border-box;}
html,body{
  height:100%;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
input, textarea, select{ -webkit-user-select:text; user-select:text; }
body{
  margin:0;
  font-family:'Segoe UI', 'Malgun Gothic', sans-serif;
  color:var(--ink);
  background:
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/24px 24px,
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/24px 24px,
    var(--paper);
  overflow:hidden;
}
button{
  font-family:inherit;
  cursor:pointer;
  border:2px solid var(--panel-border);
  background:var(--panel);
  color:var(--ink);
  border-radius:6px;
  padding:8px 12px;
  font-weight:700;
  font-size:14px;
  box-shadow:2px 2px 0 var(--panel-border);
  transition:transform .05s;
}
button:active{ transform:translate(2px,2px); box-shadow:none; }
button:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
button.accent{ background:var(--accent); color:#fff; }
button.accent2{ background:var(--accent2); color:#fff; }
button.toggled{ background:var(--ink); color:#fff; }
input[type=text],select{
  font-family:inherit;
  font-size:16px;
  padding:8px 10px;
  border:2px solid var(--panel-border);
  border-radius:6px;
}

/* ---------- 시작 화면 ---------- */
#entry-screen{
  position:fixed; inset:0;
  display:flex; align-items:flex-start; justify-content:center;
  padding-top:6vh;
  overflow-y:auto;
  z-index:50;
}
.entry-card{
  background:var(--panel);
  border:3px solid var(--panel-border);
  border-radius:14px;
  box-shadow:6px 6px 0 var(--panel-border);
  padding:36px 40px;
  width:360px;
  text-align:center;
}
.entry-card h1{
  font-size:26px; margin:0 0 4px;
  letter-spacing:1px;
}
.entry-card .sub{ font-size:13px; color:#8a8377; margin-bottom:20px;}
.entry-card label{ display:block; text-align:left; font-size:13px; font-weight:700; margin:14px 0 4px; }
.entry-card input, .entry-card select{ width:100%; }
.entry-card .start-btn{ width:100%; margin-top:24px; font-size:17px; padding:12px; }
.pixel-deco{
  width:56px; height:56px; margin:0 auto 12px;
  background:
    linear-gradient(45deg, var(--accent) 25%, transparent 25%) -8px 0/16px 16px,
    linear-gradient(45deg, var(--accent2) 25%, transparent 25%) 0 -8px/16px 16px,
    linear-gradient(45deg, var(--accent3) 25%, transparent 25%) 8px 0/16px 16px;
  border:2px solid var(--panel-border);
  border-radius:8px;
}

/* ---------- 난이도 선택 모달 ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(44,42,38,.55);
  display:flex; align-items:center; justify-content:center; z-index:60;
}
.modal-card{
  background:var(--panel); border:3px solid var(--panel-border);
  border-radius:14px; box-shadow:6px 6px 0 var(--panel-border);
  padding:28px 26px; width:440px; text-align:center;
}
.modal-card h2{ margin-top:0; }
.diff-options{ display:flex; gap:10px; margin:18px 0; }
.diff-btn{ flex:1; padding:16px 6px; font-size:14px; }
.diff-btn small{ display:block; font-weight:400; color:#8a8377; margin-top:4px;}

/* ---------- 앱 레이아웃 ---------- */
#app-screen{ display:none; height:100vh; flex-direction:column; }
#app-screen.active{ display:flex; }

.topbar{
  display:flex; align-items:center; gap:8px;
  padding:8px 14px; background:var(--panel);
  border-bottom:3px solid var(--panel-border);
  flex-wrap:wrap;
}
.topbar .who{ font-size:13px; font-weight:700; margin-right:auto; color:#5b5648; }
.topbar .save-indicator{ font-size:12px; color:var(--accent2); font-weight:700; min-width:90px; }

.main-area{ flex:1; display:flex; overflow:hidden; position:relative; }

.side-tools{
  width:60px; background:var(--panel);
  border-right:3px solid var(--panel-border);
  padding:8px 6px; display:flex; flex-direction:column; gap:8px;
  overflow-y:auto; flex-shrink:0;
}
.side-tools button{ font-size:24px; padding:10px 2px; line-height:1; }
.tool-icon{ width:26px; height:26px; object-fit:contain; display:block; margin:0 auto; pointer-events:none; }
.tool-flyout{
  position:fixed; z-index:200;
  background:var(--panel); border:2px solid var(--panel-border); border-radius:8px;
  padding:4px; display:flex; flex-direction:column; gap:2px;
  width:max-content; max-width:220px;
}
.tool-flyout-item{
  display:flex; align-items:center; gap:8px; padding:8px 10px; border:none;
  background:transparent; border-radius:6px; font-size:13px; text-align:left;
  box-shadow:none; width:100%; cursor:pointer; white-space:nowrap;
}
.tool-flyout-item:hover{ background:#fff2e6; }
.tool-flyout-item img.tool-icon{ width:20px; height:20px; margin:0; }

/* 포토샵처럼, 길게 눌러서 다른 도구를 고를 수 있는 버튼 오른쪽 아래에 작은 삼각형 표시 */
.has-flyout{ position:relative; }
.has-flyout::after{
  content:"";
  position:absolute;
  right:3px; bottom:3px;
  width:0; height:0;
  border-style:solid;
  border-width:0 0 7px 7px;
  border-color:transparent transparent var(--panel-border) transparent;
  pointer-events:none;
}
.side-tools .group-label{
  font-size:9px; color:#8a8377; font-weight:700; margin-top:6px;
  text-align:center; letter-spacing:-0.5px;
}

.canvas-wrap-outer{
  flex:1; position:relative; overflow:auto;
  background:#ffffff;
  display:flex; align-items:center; justify-content:center;
  touch-action:none;
}
.canvas-stack{ position:relative; image-rendering:pixelated; background:#ffffff; }
.canvas-stack canvas{ position:absolute; top:0; left:0; image-rendering:pixelated; }

.palette-panel{
  width:150px; background:var(--panel);
  border-left:3px solid var(--panel-border);
  display:flex; flex-direction:column;
  flex-shrink:0;
  transition:width .22s ease;
  overflow:hidden;
}
.palette-panel.collapsed{ width:40px; }
.palette-toggle{
  width:100%; flex-shrink:0; padding:10px 0; font-size:18px;
  background:var(--panel); border:none; border-bottom:2px solid var(--panel-border);
  border-radius:0; box-shadow:none;
}
.palette-panel-inner{ flex:1; overflow-y:auto; padding:10px; width:150px; }
.palette-panel.collapsed .palette-panel-inner{ display:none; }
.swatch-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.swatch{
  width:100%; aspect-ratio:1; border-radius:6px;
  border:2px solid var(--panel-border); cursor:pointer;
}
.swatch.selected{ outline:3px solid var(--accent); outline-offset:1px; }
.color-picker-row{ margin-top:10px; display:flex; align-items:center; gap:6px; }
.rainbow-picker-btn{
  width:44px; height:44px; border-radius:10px;
  background:conic-gradient(from 0deg, #ff3b3b, #ff9a3d, #ffe23d, #6bdc5a, #3ddbc7, #3d8bff, #a35dff, #ff3b3b);
  border:2px solid var(--panel-border);
  box-shadow:2px 2px 0 var(--panel-border);
  padding:0;
}
.color-popup{
  background:var(--panel); border:3px solid var(--panel-border); border-radius:14px;
  box-shadow:5px 5px 0 var(--panel-border); padding:16px; width:260px; text-align:center;
}
#sv-canvas{ display:block; margin:0 auto; border-radius:8px; border:2px solid var(--panel-border); touch-action:none; cursor:crosshair; }
#hue-canvas{ display:block; margin:10px auto 0; border-radius:8px; border:2px solid var(--panel-border); touch-action:none; cursor:pointer; }
.color-popup-footer{ display:flex; align-items:center; gap:10px; margin-top:12px; }
#color-preview-swatch{ width:34px; height:34px; border-radius:50%; border:2px solid var(--panel-border); flex-shrink:0; }
#rgb-readout{ font-size:12px; flex:1; text-align:left; color:#5b5648; }
#color-popup-close{ font-size:12px; padding:8px 12px; white-space:nowrap; }

.guide-box{ margin-top:14px; padding-top:10px; border-top:2px dashed var(--grid-line); font-size:12px; }
.guide-box input[type=range]{ width:100%; }
.guide-box .row{ display:flex; align-items:center; justify-content:space-between; }
.guide-gallery{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:8px 0; }
.guide-thumb{
  position:relative; aspect-ratio:1; border:2px solid var(--panel-border); border-radius:6px;
  overflow:hidden; cursor:pointer; background:#eee;
  display:flex; align-items:center; justify-content:center;
}
.guide-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.guide-thumb.selected{ outline:3px solid var(--accent); outline-offset:1px; }
.guide-thumb .label{ position:absolute; bottom:0; left:0; right:0; background:rgba(44,42,38,.65); color:#fff; font-size:9px; text-align:center; padding:2px 0; }
.guide-thumb.missing{ font-size:9px; color:#999; text-align:center; padding:4px; line-height:1.3; }

.bottombar{
  background:var(--panel); border-top:3px solid var(--panel-border);
  padding:8px 12px; display:flex; align-items:center; gap:10px;
  flex-wrap:nowrap; overflow:hidden;
}
.bottombar > button{ flex-shrink:0; }
.frame-list-wrap{
  flex:1; min-width:0; overflow-x:auto; overflow-y:hidden;
  display:flex; scroll-behavior:smooth;
}
.frame-scroll-btn{
  flex-shrink:0; width:26px; height:40px; padding:0;
  display:flex; align-items:center; justify-content:center; font-size:14px;
}
.frame-thumb{
  position:relative; width:56px; height:56px; flex:0 0 auto;
  border:2px solid var(--panel-border); border-radius:6px;
  background:
    linear-gradient(45deg,#eee 25%,transparent 25%) 0 0/8px 8px,
    linear-gradient(-45deg,#eee 25%,transparent 25%) 0 0/8px 8px,
    linear-gradient(45deg,transparent 75%,#eee 75%) 0 0/8px 8px,
    linear-gradient(-45deg,transparent 75%,#eee 75%) 0 0/8px 8px,#fff;
  cursor:pointer;
}
.frame-thumb.active{ outline:3px solid var(--accent); outline-offset:2px; }
.frame-thumb canvas{ width:100%; height:100%; image-rendering:pixelated; }
.frame-thumb .star{
  position:absolute; top:-8px; left:-8px; font-size:14px; cursor:pointer;
  background:#fff; border:2px solid var(--panel-border); border-radius:50%;
  width:22px; height:22px; display:flex; align-items:center; justify-content:center;
}
.frame-thumb .star.is-rep{ background:gold; }
.frame-thumb .del{
  position:absolute; top:-8px; right:-8px; font-size:11px; cursor:pointer;
  background:var(--danger); color:#fff; border:2px solid var(--panel-border); border-radius:50%;
  width:20px; height:20px; display:flex; align-items:center; justify-content:center;
}

.toast{
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:14px 22px; border-radius:10px;
  font-weight:700; z-index:100; box-shadow:3px 3px 0 rgba(0,0,0,.3);
  display:none;
}
.toast.show{ display:block; }

.hidden{ display:none !important; }
</style>
</head>
<body>

<!-- ===================== 시작 화면 ===================== -->
<div id="entry-screen">
  <div class="entry-card">
    <div class="pixel-deco"></div>
    <h1>픽셀아트 클래스</h1>
    <div class="sub">이름과 반을 선택하고 수업을 시작해요</div>

    <label for="student-name">이름</label>
    <input type="text" id="student-name" placeholder="예: 김민준" maxlength="10">

    <label for="student-class">반</label>
    <select id="student-class">
      <option value="">반을 선택하세요</option>
      <option value="신도림초A">신도림초 A반</option>
      <option value="신도림초B">신도림초 B반</option>
      <option value="등현초A">등현초 A반</option>
      <option value="등현초B">등현초 B반</option>
      <option value="신남초A">신남초 A반</option>
      <option value="신남초B">신남초 B반</option>
    </select>

    <label for="student-topic">주제</label>
    <select id="student-topic">
      <option value="zodiac">12동물 이모티콘</option>
      <option value="misc">여러가지 이모티콘</option>
    </select>

    <button class="accent start-btn" id="start-btn">🎨 수업 시작하기</button>
  </div>
</div>

<!-- ===================== 난이도 선택 모달 ===================== -->
<div class="modal-backdrop hidden" id="diff-modal">
  <div class="modal-card">
    <h2 id="diff-modal-title">난이도를 선택하세요</h2>
    <div class="diff-options">
      <button class="diff-btn" data-size="16">16 × 16<small>초급</small></button>
      <button class="diff-btn" data-size="26">26 × 26<small>중급</small></button>
      <button class="diff-btn" data-size="36">36 × 36<small>고급</small></button>
    </div>
    <button id="diff-continue-btn" class="hidden accent2" style="width:100%;margin-top:6px;">이어서 그리기</button>
  </div>
</div>

<!-- ===================== 무지개색 커스텀 색상 선택 팝업 ===================== -->
<div class="modal-backdrop hidden" id="color-popup-backdrop">
  <div class="color-popup" id="color-popup">
    <canvas id="sv-canvas" width="220" height="150"></canvas>
    <canvas id="hue-canvas" width="220" height="18"></canvas>
    <div class="color-popup-footer">
      <div id="color-preview-swatch"></div>
      <div id="rgb-readout">255, 138, 61</div>
      <button id="color-popup-close" title="선택 완료">✓ 완료</button>
    </div>
  </div>
</div>

<!-- ===================== 커스텀 확인창 (네이티브 confirm 대신 - 전체화면 유지용) ===================== -->
<div class="modal-backdrop hidden" id="custom-confirm-modal">
  <div class="modal-card" style="width:300px;">
    <div id="custom-confirm-message" style="font-size:14px; line-height:1.6; margin-bottom:18px;"></div>
    <div style="display:flex; gap:10px;">
      <button id="custom-confirm-cancel" style="flex:1;">취소</button>
      <button id="custom-confirm-ok" class="accent" style="flex:1;">확인</button>
    </div>
  </div>
</div>

<!-- ===================== 앱 화면 ===================== -->
<div id="app-screen">
  <div class="topbar">
    <span class="who" id="who-label"></span>
    <span class="save-indicator" id="save-indicator">✓ 저장됨</span>
    <button id="new-btn">🆕 새 작품</button>
    <button id="load-btn">📂 불러오기</button>
    <button id="png-btn">🖼 PNG 저장</button>
    <button class="accent" id="submit-btn">📤 제출하기</button>
    <button id="minigame-btn" disabled title="제출을 완료하면 미니게임을 할 수 있어요">🎮 미니게임</button>
    <button id="fullscreen-toggle-btn" title="전체화면 켜기/끄기">⛶ 전체화면</button>
  </div>

  <div class="main-area">
    <div class="side-tools">
      <button id="tool-pencil" class="toggled" title="연필">✏️</button>
      <button id="tool-fill" title="채우기"><img class="tool-icon" src="icons/fill.png" alt="채우기"></button>
      <button id="combo-eraser-clear" class="has-flyout" title="지우개"><img class="tool-icon" src="icons/eraser.png" alt="지우개"></button>
      <button id="undo-btn" title="실행 취소">↩️</button>
      <button id="redo-btn" title="다시 실행">↪️</button>
      <button id="tool-pan" title="화면 이동">✋</button>
      <button id="combo-zoom" class="has-flyout" title="확대">🔍+</button>
    </div>

    <div class="canvas-wrap-outer" id="canvas-wrap-outer">
      <div class="canvas-stack" id="canvas-stack">
        <canvas id="guide-canvas"></canvas>
        <canvas id="draw-canvas"></canvas>
        <canvas id="grid-canvas"></canvas>
      </div>
    </div>

    <div class="palette-panel" id="palette-panel">
      <button id="palette-toggle-btn" class="palette-toggle" title="펼치기/접기">▶</button>
      <div class="palette-panel-inner">
        <div class="group-label" style="margin-top:0;">색상 팔레트</div>
        <div class="swatch-grid" id="swatch-grid"></div>
        <div class="color-picker-row">
          <button class="rainbow-picker-btn" id="rainbow-picker-btn" title="무지개색"></button>
        </div>

        <div class="guide-box">
          <div class="row"><b>가이드</b>
            <label><input type="checkbox" id="guide-toggle" checked> 켜기</label>
          </div>
          <div class="guide-gallery" id="guide-gallery"></div>
          <button id="guide-upload-btn" style="width:100%;margin-top:4px;font-size:12px;">🖼 내 이미지 가이드 추가</button>
          <input type="file" id="guide-file-input" accept="image/*" class="hidden">

          <label style="font-size:11px; display:block; margin-top:10px;">투명도</label>
          <input type="range" id="guide-opacity" min="10" max="90" value="45">

          <label style="font-size:11px; display:block; margin-top:8px;">
            크기 <span id="guide-scale-label" style="color:var(--accent); font-weight:700;">100%</span>
          </label>
          <div class="row" style="gap:6px; align-items:center;">
            <button id="guide-scale-down" style="width:32px; padding:8px 0; font-size:16px;">−</button>
            <input type="range" id="guide-scale" min="50" max="200" value="100" step="2" style="flex:1;">
            <button id="guide-scale-up" style="width:32px; padding:8px 0; font-size:16px;">+</button>
          </div>

          <div class="row" style="margin-top:8px; gap:6px;">
            <button id="guide-move-btn" style="flex:1;font-size:11px;padding:6px;">🧭 위치조정</button>
            <button id="guide-reset-pos-btn" style="flex:1;font-size:11px;padding:6px;">↺ 초기화</button>
          </div>
          <div id="guide-move-hint" class="hidden" style="font-size:11px;color:var(--accent);margin-top:6px;">캔버스를 드래그해서 위치를, 크기 슬라이더로 비율을 맞춰보세요</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottombar" id="frame-bar">
    <button id="frame-add-btn">➕ 프레임</button>
    <button id="frame-dup-btn">📑 복제</button>
    <div class="frame-list-wrap" id="frame-list-wrap">
      <div id="frame-list" style="display:flex; gap:10px;"></div>
    </div>
    <button class="frame-scroll-btn hidden" id="frame-scroll-right" title="오른쪽으로 이동">▶</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* =========================================================
   0. 설정값 (선생님이 필요하면 이 부분만 수정하면 됩니다)

function createEmptyProject(size, studentName, className, topic){
  topic = topic || "misc";
  const topicGuides = BUILTIN_GUIDES[topic] && BUILTIN_GUIDES[topic][size];
  const firstGuide = (topicGuides && topicGuides[0]) ? topicGuides[0].id : null;
  return {
    studentName, className, topic,
    size,
    frames: [ new Array(size*size).fill(null) ],
    currentFrame: 0,
    repFrame: 0,
    guide: { type:"builtin", builtinId: firstGuide, customSrc:null, on:true, opacity:45, offsetX:0, offsetY:0, scale:1 },
    submitted: false, // 제출을 완료해야 미니게임 버튼이 활성화됨
    updatedAt: Date.now()
  };
}

function storageKey(className, studentName){
  return `pixelart_project_${className}_${studentName}`;
}

/* =========================================================

   ========================================================= */
function showToast(msg, ms=2400){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toastEl.classList.remove("show"), ms);
}

// 네이티브 confirm()은 전체화면을 강제로 풀어버리는 브라우저가 많아서,
// 직접 만든 확인창으로 대체 (전체화면이 유지됨)
function showConfirm(message, onConfirm){
  const modal = $("custom-confirm-modal");
  const okBtn = $("custom-confirm-ok");
  const cancelBtn = $("custom-confirm-cancel");
  $("custom-confirm-message").textContent = message;
  modal.classList.remove("hidden");
  function cleanup(){
    modal.classList.add("hidden");
    okBtn.removeEventListener("click", onOk);
    cancelBtn.removeEventListener("click", onCancel);
  }
  function onOk(){ cleanup(); onConfirm(); }
  function onCancel(){ cleanup(); }
  okBtn.addEventListener("click", onOk);
  cancelBtn.addEventListener("click", onCancel);
}

function idxOf(x,y,size){ return y*size + x; }

/* =========================================================
   4. 시작 화면 -> 전체화면(kiosk) 진입
   ========================================================= */
$("start-btn").addEventListener("click", () => {
  const name = $("student-name").value.trim();
  const cls = $("student-class").value;
  const topic = $("student-topic").value;
  if(!name){ showToast("이름을 입력해주세요"); return; }
  if(!cls){ showToast("반을 선택해주세요"); return; }

  // 공용 유틸(classroom-input-guard.js)이 있으면 그대로 사용, 없으면 기본 전체화면으로 대체
  try{
    if(window.ClassroomInputGuard && typeof window.ClassroomInputGuard.enterKioskMode === "function"){
      window.ClassroomInputGuard.enterKioskMode();
    } else if(document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  }catch(e){ /* 전체화면 실패해도 수업은 계속 진행 */ }

  entryScreen.classList.add("hidden");
  whoLabel.textContent = `${cls} · ${name}`;

  const existing = localStorage.getItem(storageKey(cls, name));
  let canContinue = !!existing;
  if(existing){
    try{
      const parsed = JSON.parse(existing);
      if(parsed.gamePlayed) canContinue = false; // 게임을 한 번 실행한 작품은 이어서 그릴 수 없음
    }catch(e){}
  }
  openDifficultyModal(cls, name, topic, canContinue);
});

   6. 앱 시작 / 캔버스 크기 세팅
   ========================================================= */
function startApp(){
  appScreen.classList.add("active");
  buildPalette();
  history = []; redoStack = [];
  rebuildAll();
}

function setCanvasPixelSize(){
  const cellScreen = BASE_CELL * ZOOM_STEPS[zoomIndex];
  const px = Math.round(state.size * cellScreen);
  [guideCanvas, drawCanvas].forEach(c=>{
    c.width = state.size * BASE_CELL;   // 실제 해상도는 고정, 표시 크기만 변경
    c.height = state.size * BASE_CELL;
    c.style.width = px + "px";
    c.style.height = px + "px";
  });
  // 격자는 CSS로 늘리거나 줄이면 얇은 선이 사라질 수 있어서, 항상 실제 화면
  // 픽셀 크기 그대로(1:1) 그려서 아무리 축소해도 선이 사라지지 않게 함
  gridCanvas.width = px;
  gridCanvas.height = px;
  gridCanvas.style.width = px + "px";
  gridCanvas.style.height = px + "px";
  canvasStack.style.width = px + "px";
  canvasStack.style.height = px + "px";
}

function drawGridCanvas(){
  const cellScreen = gridCanvas.width / state.size; // 실제 화면 픽셀 기준 한 칸 크기
  grCtx.clearRect(0,0,gridCanvas.width, gridCanvas.height);
  grCtx.strokeStyle = "#d9d3c6";
  grCtx.lineWidth = 1;
  // 선택한 난이도(16, 26, 36) 칸 수만큼 정확히 격자선을 그림
  for(let i=0; i<=state.size; i++){
    const pos = Math.round(i * cellScreen) + 0.5; // 1px 선명한 선을 위해 0.5 보정
    grCtx.beginPath();
    grCtx.moveTo(pos, 0); grCtx.lineTo(pos, gridCanvas.height);
    grCtx.stroke();
    grCtx.beginPath();
    grCtx.moveTo(0, pos); grCtx.lineTo(gridCanvas.width, pos);
    grCtx.stroke();
  }
}

// 화면(캔버스 영역) 크기에 맞춰, 그림 전체가 한눈에 들어오는 확대 배율을 찾음
// (작은 모바일 화면에서 처음부터 축소해서 봐야 하는 불편을 없애기 위함)
function computeFitZoomIndex(){
  const availW = canvasWrapOuter.clientWidth - 24;
  const availH = canvasWrapOuter.clientHeight - 24;
  const natural = state.size * BASE_CELL;
  if(availW <= 0 || availH <= 0) return 3; // 아직 레이아웃 전이면 기본 100%
  let bestIndex = 0; // 맞는 단계가 없으면 가장 작은 단계(50%)라도 사용 (화면 밖으로 넘치는 것 방지)
  for(let i = ZOOM_STEPS.length - 1; i >= 0; i--){
    const sizeAtStep = natural * ZOOM_STEPS[i];
    if(sizeAtStep <= availW && sizeAtStep <= availH){ bestIndex = i; break; }
  }
  return bestIndex;
}

function rebuildAll(){
  zoomIndex = computeFitZoomIndex();
  initialFitZoomIndex = zoomIndex; // "100% 보기" 버튼이 원본 100%가 아니라 이 비율로 돌아가도록 기억해둠
  setCanvasPixelSize();
  drawGridCanvas();
  loadGuideForState();
  redrawDrawCanvas();
  renderFrameThumbs();
  updateGuideControlsFromState();
  updateMinigameButtonState();
  scheduleAutosave(true);
}

function updateMinigameButtonState(){

}

function buildPalette(){
  swatchGrid.innerHTML = "";
  PALETTE.forEach(color=>{
    const div = document.createElement("div");
    div.className = "swatch" + (color === selectedColor ? " selected" : "");
    div.style.background = color;
    div.addEventListener("click", ()=>{
      selectedColor = color;
      if(currentTool !== "fill") currentTool = "pencil"; // 채우기 도구는 색만 바꾸고 유지
      updateToolButtons();
      document.querySelectorAll(".swatch").forEach(s=>s.classList.remove("selected"));
      div.classList.add("selected");
    });
    swatchGrid.appendChild(div);
  });
}
/* =========================================================
   7.5 무지개색 커스텀 팝업 (PC/모바일 동일하게 작은 팝업으로 바로 색 선택)
   ========================================================= */
const svCanvas = $("sv-canvas");
const hueCanvas = $("hue-canvas");
const svCtx = svCanvas.getContext("2d");
const hueCtx = hueCanvas.getContext("2d");
let pickerHue = 20, pickerSat = 76, pickerVal = 100; // 기본값(#ff8a3d) 대응
let svDragging = false, hueDragging = false;

function hsvToRgb(h,s,v){
  s/=100; v/=100;
  const c = v*s, x = c*(1-Math.abs((h/60)%2-1)), m = v-c;
  let r,g,b;
  if(h<60){ r=c;g=x;b=0; } else if(h<120){ r=x;g=c;b=0; }
  else if(h<180){ r=0;g=c;b=x; } else if(h<240){ r=0;g=x;b=c; }
  else if(h<300){ r=x;g=0;b=c; } else { r=c;g=0;b=x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h=60*(((g-b)/d)%6);
    else if(max===g) h=60*((b-r)/d+2);
    else h=60*((r-g)/d+4);
  }
  if(h<0) h+=360;
  const s = max===0 ? 0 : d/max;
  return [h, s*100, max*100];
}
function rgbToHex(r,g,b){
  return "#" + [r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function hexToRgbArr(hex){
  hex = hex.replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const num = parseInt(hex,16);
  return [(num>>16)&255, (num>>8)&255, num&255];
}

function drawHueCanvas(){
  hueCtx.clearRect(0,0,hueCanvas.width,hueCanvas.height);
  const grad = hueCtx.createLinearGradient(0,0,hueCanvas.width,0);
  for(let i=0;i<=6;i++) grad.addColorStop(i/6, `hsl(${i*60},100%,50%)`);
  hueCtx.fillStyle = grad;
  hueCtx.fillRect(0,0,hueCanvas.width,hueCanvas.height);
  const x = (pickerHue/360)*hueCanvas.width;
  hueCtx.strokeStyle = "#fff"; hueCtx.lineWidth = 3;
  hueCtx.beginPath(); hueCtx.moveTo(x,0); hueCtx.lineTo(x,hueCanvas.height); hueCtx.stroke();
  hueCtx.strokeStyle = "#000"; hueCtx.lineWidth = 1;
  hueCtx.beginPath(); hueCtx.moveTo(x,0); hueCtx.lineTo(x,hueCanvas.height); hueCtx.stroke();
}
function drawSvCanvas(){
  const w = svCanvas.width, h = svCanvas.height;
  const [hr,hg,hb] = hsvToRgb(pickerHue,100,100);
  svCtx.fillStyle = `rgb(${hr},${hg},${hb})`;
  svCtx.fillRect(0,0,w,h);
  const whiteGrad = svCtx.createLinearGradient(0,0,w,0);
  whiteGrad.addColorStop(0,"rgba(255,255,255,1)"); whiteGrad.addColorStop(1,"rgba(255,255,255,0)");
  svCtx.fillStyle = whiteGrad; svCtx.fillRect(0,0,w,h);
  const blackGrad = svCtx.createLinearGradient(0,0,0,h);
  blackGrad.addColorStop(0,"rgba(0,0,0,0)"); blackGrad.addColorStop(1,"rgba(0,0,0,1)");
  svCtx.fillStyle = blackGrad; svCtx.fillRect(0,0,w,h);

  const cx = (pickerSat/100)*w, cy = (1-pickerVal/100)*h;
  svCtx.beginPath(); svCtx.arc(cx,cy,7,0,Math.PI*2);
  svCtx.strokeStyle = "#fff"; svCtx.lineWidth = 3; svCtx.stroke();
  svCtx.strokeStyle = "#000"; svCtx.lineWidth = 1; svCtx.stroke();
}
function updatePickerColor(){
  const [r,g,b] = hsvToRgb(pickerHue, pickerSat, pickerVal);
  const hex = rgbToHex(r,g,b);
  selectedColor = hex;
  if(currentTool !== "fill") currentTool = "pencil";
  updateToolButtons();
  document.querySelectorAll(".swatch").forEach(s=>s.classList.remove("selected"));
  $("color-preview-swatch").style.background = hex;
  $("rgb-readout").textContent = `${r}, ${g}, ${b}`;
}
function svPointFromEvent(evt){
  const rect = svCanvas.getBoundingClientRect();
  const cx = evt.touches ? evt.touches[0].clientX : evt.clientX;
  const cy = evt.touches ? evt.touches[0].clientY : evt.clientY;
  const x = Math.max(0, Math.min(rect.width, cx - rect.left));
  const y = Math.max(0, Math.min(rect.height, cy - rect.top));
  pickerSat = (x / rect.width) * 100;
  pickerVal = 100 - (y / rect.height) * 100;
}
function huePointFromEvent(evt){
  const rect = hueCanvas.getBoundingClientRect();
  const cx = evt.touches ? evt.touches[0].clientX : evt.clientX;
  const x = Math.max(0, Math.min(rect.width, cx - rect.left));
  pickerHue = (x / rect.width) * 360;
}

svCanvas.addEventListener("pointerdown", (e)=>{ svDragging = true; svPointFromEvent(e); drawSvCanvas(); updatePickerColor(); });
window.addEventListener("pointermove", (e)=>{
  if(svDragging){ svPointFromEvent(e); drawSvCanvas(); updatePickerColor(); }
  if(hueDragging){ huePointFromEvent(e); drawHueCanvas(); drawSvCanvas(); updatePickerColor(); }
});
window.addEventListener("pointerup", ()=>{ svDragging = false; hueDragging = false; });
hueCanvas.addEventListener("pointerdown", (e)=>{ hueDragging = true; huePointFromEvent(e); drawHueCanvas(); drawSvCanvas(); updatePickerColor(); });

// 롱프레스 시 도구를 바꿀 수 있는 작은 팝업(플라이아웃) 공용 로직
let openFlyoutEl = null;
function closeFlyout(){
  if(openFlyoutEl){
    openFlyoutEl.remove();
    openFlyoutEl = null;
    document.removeEventListener("pointerdown", flyoutOutsideHandler);
  }
}
function flyoutOutsideHandler(e){
  if(openFlyoutEl && !openFlyoutEl.contains(e.target)) closeFlyout();
}
function openFlyout(anchorBtn, items){
  closeFlyout();
  const rect = anchorBtn.getBoundingClientRect();
  const fly = document.createElement("div");
  fly.className = "tool-flyout";
  fly.style.visibility = "hidden";
  items.forEach(it=>{
    const row = document.createElement("button");
    row.className = "tool-flyout-item";
    row.innerHTML = it.iconHtml + "<span>" + it.label + "</span>";
    row.addEventListener("click", (e)=>{ e.stopPropagation(); closeFlyout(); it.onSelect(); });
    fly.appendChild(row);
  });
  document.body.appendChild(fly);

  // 실제로 렌더링된 크기를 잰 다음, 버튼에 딱 붙여서 위치를 정함 (포토샵 도구 팝업처럼)
  const flyRect = fly.getBoundingClientRect();
  let left = rect.right; // 버튼 오른쪽에 틈 없이 딱 붙임
  if(left + flyRect.width > window.innerWidth) left = rect.left - flyRect.width;
  let top = rect.top;
  if(top + flyRect.height > window.innerHeight) top = window.innerHeight - flyRect.height - 4;
  fly.style.left = Math.max(2, left) + "px";
  fly.style.top = Math.max(2, top) + "px";
  fly.style.visibility = "visible";

  openFlyoutEl = fly;
  setTimeout(()=> document.addEventListener("pointerdown", flyoutOutsideHandler), 0);
}
function bindLongPress(btn, onShortTap, onLongPress){
  let timer = null, longFired = false;
  btn.addEventListener("pointerdown", (e)=>{
    e.preventDefault();
    longFired = false;
    timer = setTimeout(()=>{ longFired = true; onLongPress(); }, 480);
  });
  btn.addEventListener("pointerup", ()=>{
    clearTimeout(timer);
    if(!longFired) onShortTap();
  });
  btn.addEventListener("pointerleave", ()=> clearTimeout(timer));
}

/* =========================================================
   9. 그리기 (포인터 이벤트)
   ========================================================= */
function eventToCell(evt){
  const rect = drawCanvas.getBoundingClientRect();
  const cellSize = rect.width / state.size;
  const x = Math.floor((evt.clientX - rect.left) / cellSize);
  const y = Math.floor((evt.clientY - rect.top) / cellSize);
  if(x<0 || y<0 || x>=state.size || y>=state.size) return null;
  return {x,y};
}

function paintCell(x,y){
  const i = idxOf(x,y,state.size);
  const pixels = currentPixels();
  const newVal = currentTool === "eraser" ? null : selectedColor;
  if(pixels[i] === newVal) return;
  pixels[i] = newVal;
}

// 같은 색으로 이어진 영역을 한 번에 채우는 채우기(버킷) 도구
function floodFillCell(startX, startY, newColor){
  const pixels = currentPixels();
  const startIdx = idxOf(startX, startY, state.size);
  const target = pixels[startIdx];
  if(target === newColor) return;
  const stack = [[startX, startY]];
  while(stack.length){
    const [x,y] = stack.pop();
    if(x<0 || y<0 || x>=state.size || y>=state.size) continue;
    const i = idxOf(x,y,state.size);
    if(pixels[i] !== target) continue;
    pixels[i] = newColor;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
}

function redrawDrawCanvas(){
  dCtx.clearRect(0,0,drawCanvas.width, drawCanvas.height);
  const pixels = currentPixels();
  for(let y=0;y<state.size;y++){
    for(let x=0;x<state.size;x++){
      const c = pixels[idxOf(x,y,state.size)];
      if(c){
        dCtx.fillStyle = c;
        dCtx.fillRect(x*BASE_CELL, y*BASE_CELL, BASE_CELL, BASE_CELL);
      }
    }
  }
}

canvasWrapOuter.addEventListener("pointerdown", (evt)=>{
  if(currentTool === "pan"){
    isPanning = true;
    panStart = { x: evt.clientX, y: evt.clientY, sl: canvasWrapOuter.scrollLeft, st: canvasWrapOuter.scrollTop };
    canvasWrapOuter.style.cursor = "grabbing";
    return;
  }
  if(currentTool === "guide-move"){
    isGuideDragging = true;
    guideDragStart = { x: evt.clientX, y: evt.clientY, offX: state.guide.offsetX||0, offY: state.guide.offsetY||0 };
    return;
  }
  if(currentTool === "fill"){
    const cell = eventToCell(evt);
    if(!cell) return;
    pushHistory();
    floodFillCell(cell.x, cell.y, selectedColor);
    redrawDrawCanvas();
    renderFrameThumbs();
    scheduleAutosave();
    return;
  }
  const cell = eventToCell(evt);
  if(!cell) return;
  isDrawing = true;
  pushHistory();
  paintCell(cell.x, cell.y);
  redrawDrawCanvas();
});
window.addEventListener("pointermove", (evt)=>{
  if(isPanning && panStart){
    canvasWrapOuter.scrollLeft = panStart.sl - (evt.clientX - panStart.x);
    canvasWrapOuter.scrollTop  = panStart.st - (evt.clientY - panStart.y);
    return;
  }
  if(isGuideDragging && guideDragStart){
    const rect = drawCanvas.getBoundingClientRect();
    const scale = drawCanvas.width / rect.width; // 화면 픽셀 이동량을 캔버스 해상도 기준으로 환산
    state.guide.offsetX = guideDragStart.offX + (evt.clientX - guideDragStart.x) * scale;
    state.guide.offsetY = guideDragStart.offY + (evt.clientY - guideDragStart.y) * scale;
    drawGuideToCanvas();
    return;
  }
  if(!isDrawing) return;
  const cell = eventToCell(evt);
  if(!cell) return;
  paintCell(cell.x, cell.y);
  redrawDrawCanvas();
});
window.addEventListener("pointerup", ()=>{
  if(isDrawing){ isDrawing=false; renderFrameThumbs(); scheduleAutosave(); }
  if(isPanning){ isPanning=false; canvasWrapOuter.style.cursor = "grab"; }
  if(isGuideDragging){ isGuideDragging=false; guideDragStart=null; scheduleAutosave(); }
});

function performZoomIn(){
  zoomIndex = Math.min(zoomIndex+1, ZOOM_STEPS.length-1);
  setCanvasPixelSize(); drawGridCanvas(); redrawDrawCanvas(); drawGuideToCanvas();
}
function performZoomOut(){
  zoomIndex = Math.max(zoomIndex-1, 0);
  setCanvasPixelSize(); drawGridCanvas(); redrawDrawCanvas(); drawGuideToCanvas();
}
function performZoomReset(){
  zoomIndex = initialFitZoomIndex;
  setCanvasPixelSize(); drawGridCanvas(); redrawDrawCanvas(); drawGuideToCanvas();
}

function updateGuideControlsFromState(){
  guideToggle.checked = state.guide.on;

function renderGuideGallery(){
  guideGallery.innerHTML = "";
  const list = (BUILTIN_GUIDES[state.topic] && BUILTIN_GUIDES[state.topic][state.size]) || [];
  list.forEach(g=>{
    const tile = document.createElement("div");
    tile.className = "guide-thumb" + (state.guide.type === "builtin" && state.guide.builtinId === g.id ? " selected" : "");
    const img = document.createElement("img");
    img.src = g.src;
    img.onerror = ()=>{ tile.innerHTML = ""; tile.classList.add("missing"); tile.textContent = g.label + " 없음"; };
    tile.appendChild(img);
    const label = document.createElement("div");
    label.className = "label"; label.textContent = g.label;
    tile.appendChild(label);
    tile.addEventListener("click", ()=>{
      state.guide.type = "builtin";
      state.guide.builtinId = g.id;
      state.guide.offsetX = 0; state.guide.offsetY = 0; state.guide.scale = 1; // 가이드를 바꾸면 위치/크기를 다시 맞출 수 있도록 초기화
      loadGuideForState();
      updateGuideControlsFromState();
      scheduleAutosave();
    });
    guideGallery.appendChild(tile);
  });
  if(state.guide.customSrc){
    const tile = document.createElement("div");
    tile.className = "guide-thumb" + (state.guide.type === "custom" ? " selected" : "");
    const img = document.createElement("img");
    img.src = state.guide.customSrc;
    tile.appendChild(img);
    const label = document.createElement("div");
    label.className = "label"; label.textContent = "내 이미지";
    tile.appendChild(label);
    tile.addEventListener("click", ()=>{
      state.guide.type = "custom";
      state.guide.offsetX = 0; state.guide.offsetY = 0; state.guide.scale = 1;
      loadGuideForState();
      updateGuideControlsFromState();
      scheduleAutosave();
    });
    guideGallery.appendChild(tile);
  }
  if(list.length === 0 && !state.guide.customSrc){
    const msg = document.createElement("div");
    msg.style.cssText = "grid-column:1/-1; font-size:11px; color:#8a8377; text-align:center; padding:8px 4px;";
    msg.textContent = "아직 이 주제·난이도용 가이드가 없어요. 내 이미지를 올려서 써보세요!";
    guideGallery.appendChild(msg);
  }
}

function loadGuideForState(){
  if(state.guide.type === "custom" && state.guide.customSrc){
    const img = new Image();
    img.onload = ()=>{ guideImageEl = img; drawGuideToCanvas(); };
    img.onerror = ()=>{ guideImageEl = null; drawGuideToCanvas(); };
    img.src = state.guide.customSrc;
  } else {
    const list = (BUILTIN_GUIDES[state.topic] && BUILTIN_GUIDES[state.topic][state.size]) || [];
    const found = list.find(g=>g.id === state.guide.builtinId) || list[0];
    if(!found){ guideImageEl = null; drawGuideToCanvas(); return; }
    const img = new Image();
    img.onload = ()=>{ guideImageEl = img; drawGuideToCanvas(); };
    img.onerror = ()=>{ guideImageEl = null; drawGuideToCanvas(); }; // 파일 미준비 시 안내만 표시
    img.src = found.src;
  }
}

function drawGuideToCanvas(){
  gCtx.clearRect(0,0,guideCanvas.width, guideCanvas.height);
  if(!state.guide.on) return;
  gCtx.globalAlpha = state.guide.opacity/100;
  if(guideImageEl){
    gCtx.filter = "grayscale(100%)"; // 가이드는 항상 회색조로 표시해서 실제 색칠과 헷갈리지 않게 함
    const scale = state.guide.scale || 1;
    const w = guideCanvas.width * scale;
    const h = guideCanvas.height * scale;
    const baseX = (guideCanvas.width - w) / 2 + (state.guide.offsetX || 0);
    const baseY = (guideCanvas.height - h) / 2 + (state.guide.offsetY || 0);
    gCtx.drawImage(guideImageEl, baseX, baseY, w, h);
    gCtx.filter = "none";
  } else {
    // 가이드 파일이 아직 없을 때 안내 표시
    gCtx.globalAlpha = 1;
    gCtx.fillStyle = "#ddd";
    gCtx.fillRect(0,0,guideCanvas.width, guideCanvas.height);
    gCtx.fillStyle = "#999";
    gCtx.font = "12px sans-serif";
    gCtx.textAlign = "center";
    gCtx.fillText("가이드 이미지 없음", guideCanvas.width/2, guideCanvas.height/2);
  }
  gCtx.globalAlpha = 1;
}

guideToggle.addEventListener("change", ()=>{
  state.guide.on = guideToggle.checked;
  drawGuideToCanvas(); scheduleAutosave();
});
guideOpacity.addEventListener("input", ()=>{

/* =========================================================
   12. 프레임 (추가/삭제/복제/전환/대표설정)
   ========================================================= */
function renderFrameThumbs(){
  frameList.innerHTML = "";
  state.frames.forEach((pixels, i)=>{
    const wrap = document.createElement("div");
    wrap.className = "frame-thumb" + (i === state.currentFrame ? " active" : "");

    const star = document.createElement("div");
    star.className = "star" + (i === state.repFrame ? " is-rep" : "");
    star.textContent = "★";
    star.title = "대표 프레임으로 설정";
    star.addEventListener("click",(e)=>{ e.stopPropagation(); state.repFrame = i; renderFrameThumbs(); scheduleAutosave(); });
    wrap.appendChild(star);

    if(state.frames.length > 1){
      const del = document.createElement("div");
      del.className = "del"; del.textContent = "✕";
      del.title = "프레임 삭제";
      del.addEventListener("click",(e)=>{
        e.stopPropagation();
        showConfirm("이 프레임을 삭제할까요?", ()=>{
          state.frames.splice(i,1);
          if(state.currentFrame >= state.frames.length) state.currentFrame = state.frames.length-1;
          if(state.repFrame >= state.frames.length) state.repFrame = 0;
          history=[]; redoStack=[];
          redrawDrawCanvas(); renderFrameThumbs(); scheduleAutosave();
        });
      });
      wrap.appendChild(del);
    }

    const c = document.createElement("canvas");
    c.width = state.size; c.height = state.size;
    const tctx = c.getContext("2d");
    for(let y=0;y<state.size;y++) for(let x=0;x<state.size;x++){
      const col = pixels[idxOf(x,y,state.size)];
      if(col){ tctx.fillStyle = col; tctx.fillRect(x,y,1,1); }
    }
    wrap.appendChild(c);

    wrap.addEventListener("click", ()=>{
      state.currentFrame = i;
      history=[]; redoStack=[];
      redrawDrawCanvas(); renderFrameThumbs();
    });
    frameList.appendChild(wrap);
  });
  const activeThumb = frameList.querySelector(".frame-thumb.active");
  if(activeThumb) activeThumb.scrollIntoView({ inline:"nearest", block:"nearest" });
  updateFrameScrollButton();
}

$("frame-add-btn").addEventListener("click", ()=>{

/* =========================================================
   13. 자동 저장 (localStorage)
   ========================================================= */
function scheduleAutosave(immediate){
  saveIndicator.textContent = "… 저장 중";
  clearTimeout(saveTimer);
  const doSave = ()=>{
    state.updatedAt = Date.now();
    localStorage.setItem(storageKey(state.className, state.studentName), JSON.stringify(state));
    saveIndicator.textContent = "✓ 저장됨";
  };
  if(immediate) doSave(); else saveTimer = setTimeout(doSave, 500);
}

/* =========================================================
   14. PNG 내보내기 / 대표 프레임 PNG Blob 생성
   ========================================================= */
function framePixelsToBlob(pixels, callback){
  const c = document.createElement("canvas");
  c.width = state.size * EXPORT_CELL;
  c.height = state.size * EXPORT_CELL;
  const ctx = c.getContext("2d");
  for(let y=0;y<state.size;y++){
    for(let x=0;x<state.size;x++){
      const col = pixels[idxOf(x,y,state.size)];
      if(col){
        ctx.fillStyle = col;
        ctx.fillRect(x*EXPORT_CELL, y*EXPORT_CELL, EXPORT_CELL, EXPORT_CELL);
      }
    }
  }
  c.toBlob(callback, "image/png");
}

$("png-btn").addEventListener("click", ()=>{
  framePixelsToBlob(currentPixels(), (blob)=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${state.studentName}_pixelart_frame${state.currentFrame+1}.png`;
    a.click();
    URL.revokeObjectURL(url);
  });
});

  showConfirm("대표 프레임(★)을 선생님께 제출할까요?", ()=>{
    $("submit-btn").disabled = true;
    const repPixels = state.frames[state.repFrame];
    framePixelsToBlob(repPixels, async (blob)=>{
      try{
        const form = new FormData();
        form.append("file", blob, `${state.studentName}_pixelart.png`);
        form.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
        form.append("folder", `pixelart/${state.className}`);
        form.append("context", `student=${state.studentName}`);

        const res = await fetch(CLOUDINARY_URL, { method:"POST", body: form });
        if(!res.ok) throw new Error("업로드 실패");
        await res.json();
        state.submitted = true;
        updateMinigameButtonState();
        scheduleAutosave();
        showToast("🎉 제출 완료! 잘했어요", 3500);
      }catch(err){
        showToast("⚠️ 제출에 실패했어요. 다시 시도해주세요");
      }finally{
        $("submit-btn").disabled = false;
      }
    });
  });
});

$("minigame-btn").addEventListener("click", ()=>{
  const repPixels = state.frames[state.repFrame] || state.frames[0];
  const isBlank = !repPixels.some(c => !!c);
  if(isBlank){
    showToast("⚠️ 대표 캐릭터(★)에 그림이 없어요! 먼저 그림을 그려주세요");
    return;
  }
  const url = `minigame.html?class=${encodeURIComponent(state.className)}&name=${encodeURIComponent(state.studentName)}`;
  location.href = url;
});

$("palette-toggle-btn").addEventListener("click", ()=>{
  const collapsed = $("palette-panel").classList.toggle("collapsed");
  $("palette-toggle-btn").textContent = collapsed ? "◀" : "▶";
});

$("fullscreen-toggle-btn").addEventListener("click", ()=>{
  if(document.fullscreenElement){
    document.exitFullscreen().catch(()=>{});
  } else if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{});
  }
});

/* =========================================================
   16. 창 크기 변경 대응
   ========================================================= */
window.addEventListener("resize", ()=>{
  if(!state) return;
  setCanvasPixelSize(); drawGridCanvas(); redrawDrawCanvas(); drawGuideToCanvas();
});

/* =========================================================
   17. 키보드 단축키 (Ctrl+Z 실행취소 / Ctrl+Shift+Z 다시실행)
   ========================================================= */
window.addEventListener("keydown", (e)=>{
  if(!state || !appScreen.classList.contains("active")) return;
  const key = e.key.toLowerCase();
  if((e.ctrlKey || e.metaKey) && key === "z"){
    e.preventDefault();
    if(e.shiftKey) $("redo-btn").click();
    else $("undo-btn").click();
  }
});

})();
</script>
</body>
</html>
