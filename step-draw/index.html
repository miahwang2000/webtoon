<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>바다생물 그리기 클래스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-deep:#0f5e8c;
    --sea-mid:#2f9bd6;
    --sea-light:#8fd9f0;
    --sea-foam:#eaf9ff;
    --sand:#fff6e6;
    --ink:#22343f;
    --coral:#ff8a65;
    --coral-dark:#e8623f;
    --good:#3bb273;
    --shadow: 0 6px 0 rgba(15,94,140,0.25);
    --panel-w: 272px;
    --tab-w: 44px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Gaegu','Jua',sans-serif;
    background:var(--sea-foam);
    color:var(--ink);
    touch-action:none;
    user-select:none; -webkit-user-select:none;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  .screen{
    position:absolute; inset:0; display:none; flex-direction:column;
    background:var(--sea-foam);
  }
  .screen.active{display:flex;}

  /* ---------- 공용 버튼 ---------- */
  .btn{
    font-family:inherit; font-size:20px; font-weight:700;
    border:none; border-radius:16px; padding:14px 22px;
    cursor:pointer; color:#fff; background:var(--sea-mid);
    box-shadow: var(--shadow);
    transition: transform .08s ease;
  }
  .btn:active{ transform: translateY(4px); box-shadow:0 2px 0 rgba(15,94,140,0.25); }
  .btn.big{ font-size:28px; padding:20px 40px; border-radius:22px; }
  .btn.coral{ background:var(--coral); box-shadow:0 6px 0 rgba(232,98,63,0.35); }
  .btn.coral:active{ box-shadow:0 2px 0 rgba(232,98,63,0.35); }
  .btn.ghost{ background:#fff; color:var(--sea-deep); border:3px solid var(--sea-mid); box-shadow:none; padding-top:11px; padding-bottom:11px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.full{ width:100%; }
  .icon-btn{
    width:52px; height:52px; border-radius:14px; border:none;
    background:#fff; color:var(--sea-deep); font-size:24px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 rgba(15,94,140,0.18); cursor:pointer;
  }
  .icon-btn:active{ transform:translateY(3px); box-shadow:none; }
  .icon-btn:disabled{ opacity:.35; }

  /* ---------- 1. 입장 화면 ---------- */
  #screen-entry{
    align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.5), transparent 40%),
      linear-gradient(180deg, var(--sea-light) 0%, var(--sea-mid) 55%, var(--sea-deep) 100%);
    padding:24px;
  }
  .entry-card{
    width:100%; max-width:520px; background:var(--sand);
    border-radius:28px; padding:32px 28px; box-shadow:0 14px 0 rgba(15,94,140,0.3);
    max-height:94vh; overflow-y:auto;
  }
  .entry-title{
    font-family:'Jua',sans-serif; font-size:30px; text-align:center;
    color:var(--sea-deep); margin:0 0 6px;
  }
  .entry-sub{ text-align:center; color:#6b5a44; font-size:17px; margin:0 0 22px; }
  .field-label{ font-size:18px; font-weight:700; margin:16px 0 8px; color:var(--sea-deep); }
  .field-label:first-of-type{ margin-top:0; }
  #nameInput{
    width:100%; font-family:inherit; font-size:22px; padding:14px 16px;
    border-radius:14px; border:3px solid #e0d3b8; background:#fff;
  }
  #nameInput:focus{ outline:none; border-color:var(--sea-mid); }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  select.pill-select{
    width:100%; font-family:inherit; font-size:19px; padding:12px 10px;
    border-radius:14px; border:3px solid #e0d3b8; background:#fff; color:var(--ink);
  }
  .theme-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .theme-card{
    border-radius:18px; border:3px solid #e0d3b8; background:#fff;
    padding:16px 8px; text-align:center; cursor:pointer; font-size:20px; font-weight:700;
    color:var(--sea-deep);
  }
  .theme-card .emoji{ font-size:34px; display:block; margin-bottom:6px; }
  .theme-card.selected{ border-color:var(--coral); background:#fff1ea; }
  #startBtn{ width:100%; margin-top:24px; }

  /* ---------- 2. 작업 화면 ---------- */
  #screen-work{ background:var(--sea-foam); }
  .work-topbar{
    display:flex; align-items:center; padding:8px 12px; gap:8px;
    background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.06); z-index:5;
  }
  .topbar-group{ display:flex; gap:8px; }
  .step-indicator{
    flex:1; text-align:center; display:flex; gap:6px; align-items:center; justify-content:center;
    font-size:17px; font-weight:700; color:var(--sea-deep);
  }
  .dot{ width:12px; height:12px; border-radius:50%; background:#dbe9ef; }
  .dot.on{ background:var(--coral); }

  .work-main{ flex:1; display:flex; min-height:0; }

  .canvas-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:8px; min-height:0; min-width:0; position:relative;
  }
  #canvasStage{
    position:relative; background:#fff; border-radius:20px;
    box-shadow:0 8px 24px rgba(15,94,140,0.18);
    touch-action:none;
  }
  #canvasStage canvas, #canvasStage img.guideImg{
    position:absolute; inset:0; width:100%; height:100%;
  }
  #guideImg{ opacity:0.32; pointer-events:none; z-index:2; }
  #drawCanvas{ touch-action:none; z-index:1; }
  #fillCanvas{ z-index:1; }
  #lineArtCanvas{ z-index:2; pointer-events:none; }
  #decoCanvas{ z-index:3; pointer-events:none; }
  #colorClickLayer{ z-index:4; position:absolute; inset:0; display:none; }

  .empty-theme-msg{
    text-align:center; color:#6b8ea3; font-size:20px; background:#fff;
    border-radius:20px; padding:40px 24px; max-width:340px;
  }

  /* ---------- 우측 접이식 패널 ---------- */
  #sidePanel{
    width:var(--panel-w); flex:0 0 var(--panel-w); background:#fff;
    box-shadow:-3px 0 10px rgba(0,0,0,0.06);
    display:flex; position:relative; transition:width .22s ease, flex-basis .22s ease;
    z-index:5;
  }
  #sidePanel.collapsed{ width:var(--tab-w); flex-basis:var(--tab-w); }
  #panelToggle{
    position:absolute; top:50%; left:0; transform:translateY(-50%);
    width:var(--tab-w); height:72px; border:none; background:#fff;
    box-shadow:-2px 0 6px rgba(0,0,0,0.06); border-radius:14px 0 0 14px;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    color:var(--sea-deep); cursor:pointer; z-index:2;
  }
  .panel-inner{
    width:calc(var(--panel-w) - var(--tab-w)); margin-left:var(--tab-w);
    padding:16px 14px calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; height:100%; overflow-y:auto;
    opacity:1; transition:opacity .15s ease;
  }
  #sidePanel.collapsed .panel-inner{ opacity:0; pointer-events:none; }
  .panel-section{ display:flex; flex-direction:column; height:100%; }
  .panel-title{ font-size:17px; font-weight:700; color:var(--sea-deep); margin:14px 0 8px; }
  .panel-title:first-child{ margin-top:0; }

  .panel-char-list{ display:flex; flex-direction:column; gap:8px; }
  .panel-char-card{
    display:flex; align-items:center; gap:10px; border-radius:14px; border:3px solid #eef4f7;
    padding:6px 10px; cursor:pointer; background:#fff;
  }
  .panel-char-card.active{ border-color:var(--coral); background:#fff1ea; }
  .panel-char-card img{ width:44px; height:44px; object-fit:contain; }
  .panel-char-card span{ font-size:18px; font-weight:700; color:var(--sea-deep); }

  .brush-sizes{ display:flex; gap:10px; }
  .brush-dot-btn{
    width:46px; height:46px; border-radius:50%; border:3px solid #e2eef3; background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .brush-dot-btn.on{ border-color:var(--coral); }
  .brush-dot-btn span{ background:var(--ink); border-radius:50%; display:block; }

  #eraserBtn.on{ background:var(--coral); color:#fff; border-color:var(--coral); }
  #snapBtn.on{ background:var(--sea-mid); color:#fff; border-color:var(--sea-mid); }

  .tool-toggle{ display:flex; gap:8px; }
  .tool-btn{
    flex:1; font-family:inherit; font-size:16px; font-weight:700; padding:10px 4px;
    border-radius:14px; border:3px solid var(--sea-mid); background:#fff; color:var(--sea-deep);
    cursor:pointer;
  }
  .tool-btn.on{ background:var(--sea-mid); color:#fff; }

  .palette-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .swatch{
    width:100%; aspect-ratio:1/1; border-radius:50%; border:3px solid #fff;
    box-shadow:0 0 0 2px #e2eef3; cursor:pointer;
  }
  .swatch.on{ box-shadow:0 0 0 3px var(--coral); }
  .swatch-rainbow{
    position:relative; overflow:hidden;
    background:conic-gradient(#ff3b3b,#ffcf3b,#7bde4a,#3bd6ff,#3b6bff,#a13bff,#ff3b9d,#ff3b3b);
  }
  .swatch-rainbow input[type="color"]{
    position:absolute; inset:0; width:100%; height:100%; border:none; padding:0;
    opacity:0; cursor:pointer;
  }

  .panel-grow{ flex:1; }
  .panel-btn-stack{ display:flex; flex-direction:column; gap:10px; }

  /* ---------- 3. 완료 화면 ---------- */
  #screen-done{ align-items:center; justify-content:center; text-align:center; padding:24px;
    background: linear-gradient(180deg, var(--sea-light) 0%, var(--sea-mid) 100%); }
  .done-card{ background:#fff; border-radius:28px; padding:36px 28px; max-width:420px; box-shadow:0 14px 0 rgba(15,94,140,0.3); }
  .done-card img{ width:220px; margin-bottom:14px; border-radius:12px; }
  .done-title{ font-family:'Jua',sans-serif; font-size:28px; color:var(--sea-deep); margin:0 0 8px; }
  .done-actions{ display:flex; flex-direction:column; gap:12px; margin-top:20px; }

  /* ---------- 커스텀 모달 (alert/confirm 대체) ---------- */
  #modalOverlay{
    position:fixed; inset:0; background:rgba(15,40,55,0.55);
    display:none; align-items:center; justify-content:center; z-index:999; padding:24px;
  }
  #modalOverlay.active{ display:flex; }
  .modal-box{ background:#fff; border-radius:22px; padding:28px 24px; max-width:360px; text-align:center; }
  .modal-msg{ font-size:20px; margin-bottom:20px; color:var(--ink); line-height:1.5; }
  .modal-actions{ display:flex; gap:10px; justify-content:center; }

  /* ---------- 로딩 오버레이 ---------- */
  #loadingOverlay{
    position:fixed; inset:0; background:rgba(15,40,55,0.75); color:#fff;
    display:none; align-items:center; justify-content:center; z-index:1000; font-size:22px; flex-direction:column; gap:14px;
  }
  #loadingOverlay.active{ display:flex; }
  .spinner{ width:48px; height:48px; border-radius:50%; border:6px solid rgba(255,255,255,0.3); border-top-color:#fff; animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:480px){
    :root{ --panel-w:230px; }
    .entry-title{ font-size:25px; }
    .btn.big{ font-size:22px; padding:16px 28px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- 1. 입장 화면 -->
  <section id="screen-entry" class="screen active">
    <div class="entry-card">
      <p class="entry-title">🐧 바다생물 그리기 클래스</p>
      <p class="entry-sub">이름과 반, 주제를 선택하고 시작해요</p>

      <div class="field-label">이름</div>
      <input id="nameInput" type="text" placeholder="이름을 입력하세요" maxlength="10">

      <div class="field-label">학교 / 반</div>
      <div class="row-2">
        <select id="schoolSelect" class="pill-select">
          <option value="신도림초">신도림초</option>
          <option value="등현초">등현초</option>
          <option value="신남초">신남초</option>
        </select>
        <select id="classSelect" class="pill-select">
          <option value="A">A반</option>
          <option value="B">B반</option>
        </select>
      </div>

      <div class="field-label">오늘의 주제</div>
      <div class="theme-grid" id="themeGrid">
        <div class="theme-card selected" data-theme="sea"><span class="emoji">🌊</span>바다생물 그리기</div>
        <div class="theme-card" data-theme="misc"><span class="emoji">🎨</span>여러가지 그리기</div>
      </div>

      <button id="startBtn" class="btn coral big">수업 시작하기</button>
    </div>
  </section>

  <!-- 2. 작업 화면 (따라그리기 + 색칠, 우측 패널 포함) -->
  <section id="screen-work" class="screen">
    <div class="work-topbar">
      <div class="topbar-group">
        <button class="icon-btn" id="backToEntryBtn" title="처음으로">🏠</button>
        <button class="icon-btn" id="undoBtn" title="되돌리기">↩️</button>
      </div>
      <div class="step-indicator" id="stepIndicator"></div>
      <div class="topbar-group">
        <button class="icon-btn" id="resetBtn" title="다시 그리기">🔄</button>
      </div>
    </div>

    <div class="work-main">
      <div class="canvas-wrap">
        <div id="canvasStage">
          <canvas id="fillCanvas"></canvas>
          <canvas id="lineArtCanvas"></canvas>
          <canvas id="decoCanvas"></canvas>
          <img id="guideImg" class="guideImg" alt="가이드">
          <canvas id="drawCanvas"></canvas>
          <div id="colorClickLayer"></div>
        </div>
        <div class="empty-theme-msg" id="emptyThemeMsg" style="display:none;">
          🙈 이 주제는 곧 추가될 예정이에요!<br>왼쪽 위 홈 버튼을 눌러 다른 주제를 선택해 주세요.
        </div>
      </div>

      <aside id="sidePanel">
        <button id="panelToggle">▶</button>
        <div class="panel-inner">

          <!-- 선 그리기 단계용 패널 -->
          <div id="panelDrawSection" class="panel-section">
            <div class="panel-title">동물 고르기</div>
            <div class="panel-char-list" id="panelCharList"></div>

            <div class="panel-title">펜 굵기</div>
            <div class="brush-sizes">
              <button class="brush-dot-btn" data-size="6"><span style="width:8px;height:8px;"></span></button>
              <button class="brush-dot-btn on" data-size="10"><span style="width:13px;height:13px;"></span></button>
              <button class="brush-dot-btn" data-size="16"><span style="width:19px;height:19px;"></span></button>
            </div>

            <div class="panel-title">지우개</div>
            <button id="eraserBtn" class="btn ghost full">🧹 지우개 켜기</button>

            <div class="panel-title">가이드 스냅</div>
            <button id="snapBtn" class="btn ghost full on">🧲 스냅 켜짐</button>

            <div class="panel-btn-stack" style="margin-top:16px;">
              <button id="nextStepBtn" class="btn coral full">다음 단계</button>
            </div>
            <div class="panel-grow"></div>
          </div>

          <!-- 색칠 단계용 패널 -->
          <div id="panelColorSection" class="panel-section" style="display:none;">
            <div class="panel-title">도구</div>
            <div class="tool-toggle" id="colorToolToggle">
              <button class="tool-btn on" data-tool="fill">🪣 채우기</button>
              <button class="tool-btn" data-tool="pen">✏️ 그리기</button>
            </div>

            <div class="panel-title">색깔 고르기</div>
            <div class="palette-grid" id="paletteGrid"></div>

            <div class="panel-grow"></div>
            <div class="panel-btn-stack">
              <button id="backToDrawBtn" class="btn ghost full">✏️ 선 그리기로 돌아가기</button>
              <button id="finishColorBtn" class="btn coral full">완성했어요</button>
            </div>
          </div>

        </div>
      </aside>
    </div>
  </section>

  <!-- 3. 완료 화면 -->
  <section id="screen-done" class="screen">
    <div class="done-card">
      <img id="doneThumb" alt="완성작">
      <p class="done-title">멋지게 완성했어요! 🎉</p>
      <p id="doneStatus" style="color:#6b8ea3;">제출 중이에요...</p>
      <div class="done-actions">
        <button class="btn ghost" id="redrawBtn">다시 그리기</button>
        <button class="btn coral" id="newCharBtn">다른 동물 그리기</button>
      </div>
    </div>
  </section>

</div>

<!-- 커스텀 모달 -->
<div id="modalOverlay">
  <div class="modal-box">
    <p class="modal-msg" id="modalMsg"></p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- 로딩 오버레이 -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">처리 중이에요...</div>
</div>

<script src="guard.js"></script>
<script src="app.js"></script>
</body>
</html>
