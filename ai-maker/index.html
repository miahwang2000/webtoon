<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>캐릭터 만들기 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- 상단: 제목 + 스탬프 진행표시 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✏️</span>
      <h1>캐릭터 만들기 공방</h1>
    </div>
    <ol class="stamps" id="stamps">
      <li data-step="1" class="stamp active"><span class="stamp-icon">🖍️</span><span class="stamp-label">스케치</span></li>
      <li data-step="2" class="stamp"><span class="stamp-icon">✨</span><span class="stamp-label">선화</span></li>
      <li data-step="3" class="stamp"><span class="stamp-icon">🎨</span><span class="stamp-label">채색</span></li>
      <li data-step="4" class="stamp"><span class="stamp-icon">📋</span><span class="stamp-label">캐릭터 시트</span></li>
      <li data-step="5" class="stamp"><span class="stamp-icon">📮</span><span class="stamp-label">제출</span></li>
    </ol>
  </header>

  <main class="stage">

    <!-- STEP 1: 스케치 -->
    <section class="screen active" id="screen-1">
      <div class="panel-title">
        <h2>1. 자유롭게 스케치 해봐요</h2>
        <p>손가락(마우스)으로 그리고 싶은 것을 그려보세요.</p>
      </div>

      <div class="canvas-wrap">
        <canvas id="sketchCanvas" width="600" height="600"></canvas>
        <div class="canvas-tools">
          <button class="tool-btn" id="tool-pen" data-tool="pen" aria-label="펜">🖊️ 펜</button>
          <button class="tool-btn" id="tool-eraser" data-tool="eraser" aria-label="지우개">🧽 지우개</button>
          <button class="tool-btn danger" id="btn-clear-sketch">🗑️ 전체 지우기</button>
        </div>
      </div>

      <div class="field-group">
        <label for="subjectInput">① 무엇을 그렸나요?</label>
        <input type="text" id="subjectInput" placeholder="예: 고양이, 호랑이, 토끼, 로봇, 공룡...">
      </div>

      <div class="field-group">
        <label>② 어떤 스타일로 만들까요?</label>
        <div class="style-choices" id="styleChoices">
          <button class="style-chip" data-style="사실적">
            <span class="chip-emoji">🐾</span><span>사실적</span>
          </button>
          <button class="style-chip" data-style="캐릭터">
            <span class="chip-emoji">🧸</span><span>캐릭터</span>
          </button>
          <button class="style-chip" data-style="이모티콘">
            <span class="chip-emoji">😊</span><span>이모티콘</span>
          </button>
        </div>
      </div>

      <div class="step-actions">
        <button class="btn primary big" id="btn-to-lineart" disabled>선화 만들기 →</button>
      </div>
    </section>

    <!-- STEP 2: AI 선화 생성 -->
    <section class="screen" id="screen-2">
      <div class="panel-title">
        <h2>2. AI가 선화를 그리고 있어요</h2>
        <p id="lineartStatusText">잠시만 기다려주세요...</p>
      </div>

      <div class="lineart-stage">
        <div class="loading-block" id="lineartLoading">
          <div class="spinner"></div>
          <p>스케치를 멋진 선화로 바꾸는 중이에요 ✨</p>
        </div>
        <div class="lineart-result" id="lineartResult" style="display:none;">
          <img id="lineartImage" alt="완성된 선화">
          <p class="fallback-badge" id="fallbackBadge" style="display:none;">🌟 추천 모드로 완성했어요</p>
        </div>
      </div>

      <div class="step-actions" id="lineartActions" style="display:none;">
        <button class="btn ghost" id="btn-restart-from-lineart">처음부터 다시</button>
        <button class="btn primary big" id="btn-to-color">채색하러 가기 →</button>
      </div>
    </section>

    <!-- STEP 3: 채색 -->
    <section class="screen" id="screen-3">
      <div class="panel-title">
        <h2>3. 색을 칠해봐요</h2>
        <p>색을 고르고 캐릭터를 톡톡 눌러 채워보세요.</p>
      </div>

      <div class="canvas-wrap">
        <canvas id="colorCanvas" width="600" height="600"></canvas>
      </div>

      <div class="palette" id="palette"></div>

      <div class="color-tools">
        <label class="custom-color-label">
          🎨 다른 색
          <input type="color" id="customColorInput" value="#ff6b6b">
        </label>
        <button class="tool-btn" id="btn-undo-color">↩️ 실행 취소</button>
        <button class="tool-btn danger" id="btn-reset-color">🗑️ 초기화</button>
      </div>

      <div class="step-actions">
        <button class="btn ghost" id="btn-back-to-lineart">← 뒤로</button>
        <button class="btn primary big" id="btn-save-color">저장하고 다음 →</button>
      </div>
    </section>

    <!-- STEP 4: 캐릭터 시트 -->
    <section class="screen" id="screen-4">
      <div class="panel-title">
        <h2>4. 캐릭터 시트를 완성해요</h2>
      </div>

      <div class="sheet">
        <div class="sheet-left">
          <div class="sheet-canvas-wrap" id="sheetCanvasWrap">
            <canvas id="sheetCanvas" width="600" height="600"></canvas>
            <div class="bubble-layer" id="bubbleLayer"></div>
          </div>
          <button class="btn ghost small" id="btn-add-bubble">💬 말풍선 추가</button>
        </div>

        <div class="sheet-right">
          <div class="field-group">
            <label for="authorInput">작가 이름</label>
            <input type="text" id="authorInput" placeholder="내 이름">
          </div>
          <div class="field-group">
            <label for="charNameInput">캐릭터 이름</label>
            <input type="text" id="charNameInput" placeholder="캐릭터 이름">
          </div>

          <div class="field-group">
            <label>성격</label>
            <div class="chip-row" data-target="personality">
              <button class="pick-chip" data-value="용감한">용감한</button>
              <button class="pick-chip" data-value="장난꾸러기">장난꾸러기</button>
              <button class="pick-chip" data-value="친절한">친절한</button>
              <button class="pick-chip" data-value="호기심 많은">호기심 많은</button>
              <button class="pick-chip custom-toggle" data-value="__custom__">✏️ 직접입력</button>
            </div>
            <input type="text" class="custom-input" id="personalityCustom" placeholder="직접 입력해보세요" style="display:none;">
          </div>

          <div class="field-group">
            <label>강점</label>
            <div class="chip-row" data-target="strength">
              <button class="pick-chip" data-value="힘이 세다">힘이 세다</button>
              <button class="pick-chip" data-value="빠르다">빠르다</button>
              <button class="pick-chip" data-value="똑똑하다">똑똑하다</button>
              <button class="pick-chip" data-value="친구가 많다">친구가 많다</button>
              <button class="pick-chip custom-toggle" data-value="__custom__">✏️ 직접입력</button>
            </div>
            <input type="text" class="custom-input" id="strengthCustom" placeholder="직접 입력해보세요" style="display:none;">
          </div>

          <div class="field-group">
            <label>약점</label>
            <div class="chip-row" data-target="weakness">
              <button class="pick-chip" data-value="겁이 많다">겁이 많다</button>
              <button class="pick-chip" data-value="느리다">느리다</button>
              <button class="pick-chip" data-value="잘 삐친다">잘 삐친다</button>
              <button class="pick-chip" data-value="길치다">길치다</button>
              <button class="pick-chip custom-toggle" data-value="__custom__">✏️ 직접입력</button>
            </div>
            <input type="text" class="custom-input" id="weaknessCustom" placeholder="직접 입력해보세요" style="display:none;">
          </div>
        </div>
      </div>

      <div class="step-actions">
        <button class="btn ghost" id="btn-back-to-color">← 뒤로</button>
        <button class="btn primary big" id="btn-to-submit">완성하러 가기 →</button>
      </div>
    </section>

    <!-- STEP 5: 저장 및 제출 -->
    <section class="screen" id="screen-5">
      <div class="panel-title">
        <h2>5. 완성! 저장하고 제출해요</h2>
      </div>

      <div class="final-preview">
        <canvas id="finalCanvas" width="900" height="600"></canvas>
      </div>

      <div class="step-actions column">
        <button class="btn primary big" id="btn-download">⬇️ PNG로 저장하기</button>
        <button class="btn secondary big" id="btn-submit">📮 선생님에게 제출하기</button>
        <p class="submit-status" id="submitStatus"></p>
        <button class="btn ghost" id="btn-new-character">🆕 새 캐릭터 만들기</button>
      </div>
    </section>

  </main>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
