<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>퀵 런처</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#15130f;
    --bg-glow: rgba(255,178,56,0.07);
    --keycap-top:#2c2830;
    --keycap-top-2:#1d1a1f;
    --keycap-side:#0c0b0d;
    --keycap-border: rgba(255,255,255,0.05);
    --amber:#ffb238;
    --amber-bright:#ffdd8f;
    --amber-dim: rgba(255,178,56,0.16);
    --text:#f5f1e8;
    --text-dim:#9a9188;
    --danger:#ff7a6b;
    --danger-dim: rgba(255,122,107,0.12);
    --ok:#7bd88f;
    --radius:20px;
    --pad: 22px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--bg-glow), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overflow-x:hidden;
  }

  .display-font{ font-family:'Do Hyeon', -apple-system, "Malgun Gothic", sans-serif; }

  a{ color: var(--amber-bright); }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px calc(var(--pad) + env(safe-area-inset-right)) 8px calc(var(--pad) + env(safe-area-inset-left));
    max-width:1100px; margin:0 auto;
  }
  header h1{
    font-size: clamp(18px, 2.4vw, 24px);
    margin:0; letter-spacing:0.5px; color:var(--text-dim); font-weight:500;
  }
  .status{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--text-dim);
  }
  .status-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--text-dim);
    transition: background .25s, box-shadow .25s;
  }
  .status-dot.ok{ background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .status-dot.error{ background:var(--danger); box-shadow:0 0 8px var(--danger); }
  .status-dot.loading{ background:var(--amber); box-shadow:0 0 8px var(--amber); animation: pulse 1s infinite ease-in-out; }

  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .reset-btn{
    appearance:none; border:none; cursor:pointer;
    background: transparent;
    color: var(--text-dim);
    font-size:12px;
    border: 1px solid var(--keycap-border);
    padding: 6px 12px;
    border-radius: 20px;
    transition: color .15s, border-color .15s;
  }
  .reset-btn:hover{ color:var(--amber-bright); border-color: var(--amber-dim); }

  /* ---------- Main layout ---------- */
  main{
    max-width:1100px; margin:0 auto;
    padding: 18px calc(var(--pad) + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left));
    min-height: calc(100vh - 70px);
    display:flex; align-items:center; justify-content:center;
  }

  /* ==========================================================================
     ENTRY SCREEN (첫 방문 시: 시트 연결 화면)
     ========================================================================== */
  .entry-card{
    width:100%; max-width:520px;
    background: linear-gradient(160deg, var(--keycap-top), var(--keycap-top-2));
    border: 1px solid var(--keycap-border);
    border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .entry-card h2{
    font-size: clamp(20px, 4vw, 26px);
    margin: 0 0 6px;
    color: var(--text);
  }
  .entry-sub{
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 24px;
    line-height:1.5;
  }

  .steps{
    list-style: none; margin: 0 0 24px; padding:0;
    display:flex; flex-direction:column; gap:14px;
  }
  .steps li{
    display:flex; gap:12px; align-items:flex-start;
    font-size:14px; line-height:1.5; color: var(--text);
  }
  .step-num{
    flex: 0 0 auto;
    width:24px; height:24px; border-radius:50%;
    background: var(--amber-dim); color: var(--amber-bright);
    font-family:'Do Hyeon', sans-serif; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .steps a.template-link{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--amber); color:#1a1204;
    font-family:'Do Hyeon', sans-serif;
    font-size:14px; text-decoration:none;
    padding: 9px 16px; border-radius: 10px;
    margin-top:6px;
    box-shadow: 0 4px 0 #b87c1e;
    transition: transform .1s ease;
  }
  .steps a.template-link:active{ transform: translateY(3px); box-shadow:0 1px 0 #b87c1e; }

  .entry-form{ display:flex; flex-direction:column; gap:10px; }
  .entry-input{
    width:100%;
    background: #14110d;
    border: 1px solid var(--keycap-border);
    color: var(--text);
    font-size: 14px;
    padding: 13px 14px;
    border-radius: 12px;
    outline: none;
    transition: border-color .15s;
  }
  .entry-input:focus{ border-color: var(--amber); }
  .entry-input::placeholder{ color: var(--text-dim); }

  .start-btn{
    appearance:none; border:none; cursor:pointer;
    background: var(--amber);
    color:#1a1204;
    font-family:'Do Hyeon', sans-serif;
    font-size:16px;
    padding: 13px 20px;
    border-radius: 12px;
    box-shadow: 0 5px 0 #b87c1e, 0 9px 16px rgba(0,0,0,0.35);
    transition: transform .1s ease;
    touch-action: manipulation;
  }
  .start-btn:active{ transform: translateY(4px); box-shadow: 0 1px 0 #b87c1e; }
  .start-btn:disabled{ opacity:.6; cursor:default; }

  .entry-error{
    display:none;
    margin-top: 6px;
    background: var(--danger-dim);
    border: 1px solid rgba(255,122,107,0.3);
    color: var(--text);
    font-size: 13px;
    line-height:1.6;
    padding: 14px 16px;
    border-radius: 12px;
  }
  .entry-error.show{ display:block; }
  .entry-error strong{ color: var(--danger); display:block; margin-bottom:6px; font-family:'Do Hyeon', sans-serif; font-size:14px; }
  .entry-error ol{ margin: 0; padding-left: 18px; }
  .entry-error li{ margin-bottom:3px; }

  /* ==========================================================================
     LAUNCHER (연결된 이후: 키캡 그리드)
     ========================================================================== */
  .grid{
    width:100%;
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 22px;
  }

  .keycap{
    position:relative;
    appearance:none; border:none; cursor:pointer;
    aspect-ratio: 1 / 0.82;
    min-height:150px;
    border-radius: var(--radius);
    background: linear-gradient(160deg, var(--keycap-top), var(--keycap-top-2));
    border: 1px solid var(--keycap-border);
    box-shadow:
      0 10px 0 var(--keycap-side),
      0 16px 24px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.06);
    color: var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    transition: transform .12s ease, box-shadow .12s ease;
    opacity:0; transform: translateY(10px);
    animation: rise .45s ease forwards;
    animation-delay: calc(var(--i, 0) * 60ms);
    touch-action: manipulation;
    -webkit-user-select:none; user-select:none;
  }

  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .keycap::after{
    content:"";
    position:absolute; left:10%; right:10%; bottom:-14px; height:22px;
    background: var(--amber);
    filter: blur(16px);
    opacity:0;
    transition: opacity .18s ease;
    border-radius:50%;
    pointer-events:none;
  }

  .keycap:hover, .keycap:focus-visible{
    transform: translateY(-4px);
    box-shadow:
      0 14px 0 var(--keycap-side),
      0 22px 30px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .keycap:hover::after, .keycap:focus-visible::after{ opacity:.55; }
  .keycap:focus-visible{ outline: 2px solid var(--amber-bright); outline-offset:3px; }

  .keycap:active, .keycap.pressed{
    transform: translateY(6px);
    box-shadow:
      0 4px 0 var(--keycap-side),
      0 8px 14px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .keycap:active::after, .keycap.pressed::after{ opacity:1; }

  .keycap-number{
    position:absolute; top:12px; left:14px;
    font-family:'Do Hyeon', sans-serif;
    font-size:13px; color: var(--amber);
    text-shadow: 0 0 8px var(--amber-dim);
    letter-spacing:0.5px;
  }

  .keycap-icon{
    font-size:34px; line-height:1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }

  .keycap-icon.fallback{
    width:44px; height:44px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background: var(--amber-dim);
    color: var(--amber-bright);
    font-size:20px;
  }

  .keycap-label{
    font-family:'Do Hyeon', sans-serif;
    font-size: clamp(16px, 2vw, 19px);
    letter-spacing:0.3px;
    text-align:center;
    padding: 0 8px;
    overflow-wrap: break-word;
  }

  .keycap.skeleton{
    cursor:default;
    background: linear-gradient(90deg, var(--keycap-top-2) 25%, var(--keycap-top) 37%, var(--keycap-top-2) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.3s ease-in-out infinite, rise .45s ease forwards;
  }
  @keyframes shimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }

  .error-panel{
    grid-column: 1/-1;
    text-align:center;
    padding: 40px 20px;
    color: var(--text-dim);
  }
  .error-panel .msg{
    font-size: clamp(16px,2.2vw,19px);
    color: var(--text);
    margin-bottom: 18px;
    font-family:'Do Hyeon', sans-serif;
  }
  .retry-btn{
    appearance:none; border:none; cursor:pointer;
    background: var(--amber);
    color:#1a1204;
    font-family:'Do Hyeon', sans-serif;
    font-size:16px;
    padding: 12px 28px;
    border-radius: 14px;
    box-shadow: 0 6px 0 #b87c1e, 0 10px 18px rgba(0,0,0,0.4);
    transition: transform .1s ease;
    touch-action: manipulation;
  }
  .retry-btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 #b87c1e; }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  @media (max-width: 700px){
    :root{ --pad: 18px; }
    .grid{ grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:16px; }
  }

  @media (max-width: 480px){
    :root{ --pad: 16px; }
    .grid{ grid-template-columns: repeat(2, 1fr); gap:14px; }
    .keycap{ min-height:120px; }
    .entry-card{ padding:24px 20px; }
  }

  @media (max-width: 360px){
    :root{ --pad: 12px; }
    .grid{ gap:10px; }
    .keycap{ min-height:104px; border-radius:16px; }
    .keycap-icon{ font-size:26px; }
    .keycap-number{ top:8px; left:10px; font-size:11px; }
    .keycap-label{ font-size:14px; }
  }

  @media (max-height: 420px) and (orientation: landscape){
    main{ min-height:auto; padding-top:10px; padding-bottom:16px; }
    .keycap{ min-height:88px; aspect-ratio: 1 / 0.6; }
    .keycap-icon{ font-size:24px; }
  }
</style>
</head>
<body>

<header>
  <h1 class="display-font">퀵 런처</h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <div class="status hidden" id="statusWrap"><span id="statusDot" class="status-dot loading"></span><span id="statusText">불러오는 중</span></div>
    <button class="reset-btn hidden" id="resetBtn" type="button">다른 시트 사용</button>
  </div>
</header>

<main>
  <!-- ================= 입장 화면 ================= -->
  <div class="entry-card" id="entryView">
    <h2 class="display-font">내 퀵 런처 만들기</h2>
    <p class="entry-sub">자주 쓰는 사이트 목록을 구글 스프레드시트로 관리하고, 버튼 하나로 즉시 여는 런처를 만들어 보세요.</p>

    <ol class="steps">
      <li>
        <span class="step-num">1</span>
        <div>
          템플릿 시트를 내 드라이브로 복사하세요.<br>
          <a class="template-link" href="https://docs.google.com/spreadsheets/d/1SGbtSQh-tUGrrSH82mWPJKefnstxisCd0fnyK9MiFb4/copy" target="_blank" rel="noopener">📄 템플릿 사본 만들기</a>
        </div>
      </li>
      <li>
        <span class="step-num">2</span>
        <div>번호 / 이름 / URL / 아이콘 열에 원하는 사이트를 채워 넣으세요.</div>
      </li>
      <li>
        <span class="step-num">3</span>
        <div>시트 오른쪽 위 <b>공유</b> → 일반 액세스를 <b>"링크가 있는 모든 사용자 - 뷰어"</b>로 바꾸세요.</div>
      </li>
      <li>
        <span class="step-num">4</span>
        <div>완성된 시트 주소를 복사해서 아래에 붙여넣고 시작하세요.</div>
      </li>
    </ol>

    <form class="entry-form" id="entryForm">
      <input class="entry-input" id="sheetInput" type="text" inputmode="url" autocomplete="off"
             placeholder="예) https://docs.google.com/spreadsheets/d/xxxxxxxx/edit" required>
      <button class="start-btn display-font" id="startBtn" type="submit">시작하기</button>
      <div class="entry-error" id="entryError"></div>
    </form>
  </div>

  <!-- ================= 런처 화면 ================= -->
  <div class="grid hidden" id="grid"></div>
</main>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "quicklauncher_v2_sheet";

  const entryView = document.getElementById("entryView");
  const grid = document.getElementById("grid");
  const entryForm = document.getElementById("entryForm");
  const sheetInput = document.getElementById("sheetInput");
  const startBtn = document.getElementById("startBtn");
  const entryError = document.getElementById("entryError");
  const statusWrap = document.getElementById("statusWrap");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const resetBtn = document.getElementById("resetBtn");

  let buttonsData = [];

  /* ---------- 저장소: 시트 링크(ID+GID)만 저장 ---------- */
  function saveSheet(sheetId, gid){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ sheetId, gid })); } catch (e) {}
  }
  function loadSavedSheet(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function clearSavedSheet(){
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  /* ---------- 붙여넣은 링크/ID에서 SHEET_ID, GID 추출 ---------- */
  function parseSheetInput(raw){
    const value = raw.trim();
    const idMatch = value.match(/\/d\/([a-zA-Z0-9-_]+)/);
    const sheetId = idMatch ? idMatch[1] : (/^[a-zA-Z0-9-_]{20,}$/.test(value) ? value : null);
    const gidMatch = value.match(/[?#&]gid=([0-9]+)/);
    const gid = gidMatch ? gidMatch[1] : "0";
    return sheetId ? { sheetId, gid } : null;
  }

  function csvUrl(sheetId, gid){
    return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&gid=${gid}&_=${Date.now()}`;
  }

  function showEntryError(){
    entryError.innerHTML = `
      <strong>이 시트를 불러올 수 없어요.</strong>
      아래를 확인한 뒤 다시 시도해 주세요.
      <ol>
        <li>스프레드시트 오른쪽 위 <b>공유</b> 버튼 클릭</li>
        <li>일반 액세스를 <b>"링크가 있는 모든 사용자"</b> + <b>"뷰어"</b>로 변경</li>
        <li>링크 주소가 정확한지 다시 확인 후 붙여넣기</li>
      </ol>`;
    entryError.classList.add("show");
  }
  function hideEntryError(){ entryError.classList.remove("show"); }

  /* ---------- 아주 작은 CSV 파서 ---------- */
  function parseCSV(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i], next = text[i+1];
      if (inQuotes){
        if (c === '"' && next === '"'){ field += '"'; i++; }
        else if (c === '"'){ inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"'){ inQuotes = true; }
        else if (c === ','){ row.push(field); field = ""; }
        else if (c === '\n' || c === '\r'){
          if (field !== "" || row.length){ row.push(field); rows.push(row); row = []; field = ""; }
          if (c === '\r' && next === '\n') i++;
        } else { field += c; }
      }
    }
    if (field !== "" || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(f => f.trim() !== ""));
  }

  function findCol(header, keywords){
    const lower = header.map(h => h.trim().toLowerCase());
    for (const kw of keywords){
      const idx = lower.findIndex(h => h.includes(kw));
      if (idx !== -1) return idx;
    }
    return -1;
  }

  function rowsToButtons(rows){
    if (!rows.length) return [];
    const header = rows[0];
    const iNo   = findCol(header, ["번호", "no", "number", "num"]);
    const iName = findCol(header, ["이름", "name"]);
    const iUrl  = findCol(header, ["url", "주소", "링크"]);
    const iIcon = findCol(header, ["아이콘", "icon"]);

    const dataRows = rows.slice(1);
    const items = dataRows.map((r, idx) => ({
      no: iNo !== -1 ? parseInt(r[iNo], 10) || (idx + 1) : (idx + 1),
      name: (iName !== -1 ? r[iName] : r[1] || "").trim(),
      url: (iUrl !== -1 ? r[iUrl] : r[2] || "").trim(),
      icon: (iIcon !== -1 ? r[iIcon] : r[3] || "").trim()
    })).filter(item => item.name && item.url);

    items.sort((a, b) => a.no - b.no);
    return items;
  }

  function normalizeUrl(url){
    if (!/^https?:\/\//i.test(url)) return "https://" + url;
    return url;
  }

  function setStatus(state, text){
    statusDot.className = "status-dot " + state;
    statusText.textContent = text;
  }

  function render(items){
    grid.innerHTML = "";
    if (!items.length){
      grid.innerHTML = `
        <div class="error-panel">
          <div class="msg display-font">시트에서 사이트 목록을 찾지 못했어요.<br>번호/이름/URL 열이 채워져 있는지 확인해 주세요.</div>
          <button class="retry-btn display-font" id="retryBtn">다시 시도</button>
        </div>`;
      document.getElementById("retryBtn").addEventListener("click", () => loadLauncher(currentConfig));
      setStatus("error", "연결 실패");
      return;
    }

    items.forEach((item, idx) => {
      const btn = document.createElement("button");
      btn.className = "keycap";
      btn.style.setProperty("--i", idx);
      btn.dataset.index = item.no;
      btn.setAttribute("aria-label", `${item.no}번, ${item.name} 열기`);

      const num = document.createElement("span");
      num.className = "keycap-number";
      num.textContent = item.no;

      const icon = document.createElement("span");
      if (item.icon){
        icon.className = "keycap-icon";
        icon.textContent = item.icon;
      } else {
        icon.className = "keycap-icon fallback";
        icon.textContent = item.name.trim().charAt(0);
      }

      const label = document.createElement("span");
      label.className = "keycap-label";
      label.textContent = item.name;

      btn.append(num, icon, label);
      btn.addEventListener("click", () => openSite(item, btn));
      grid.appendChild(btn);
    });
  }

  function openSite(item, btnEl){
    if (btnEl){
      btnEl.classList.add("pressed");
      setTimeout(() => btnEl.classList.remove("pressed"), 160);
    }
    window.open(normalizeUrl(item.url), "_blank", "noopener");
  }

  function skeletonGrid(){
    let html = "";
    for (let i = 0; i < 6; i++){
      html += `<button class="keycap skeleton" style="--i:${i}" disabled aria-hidden="true"></button>`;
    }
    grid.innerHTML = html;
  }

  let currentConfig = null;

  async function loadLauncher(config){
    currentConfig = config;
    entryView.classList.add("hidden");
    grid.classList.remove("hidden");
    statusWrap.classList.remove("hidden");
    resetBtn.classList.remove("hidden");
    skeletonGrid();
    setStatus("loading", "불러오는 중");

    try {
      const res = await fetch(csvUrl(config.sheetId, config.gid), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const rows = parseCSV(text);
      const items = rowsToButtons(rows);
      buttonsData = items;
      render(items);
      if (items.length) setStatus("ok", "연결됨");
    } catch (err){
      grid.innerHTML = `
        <div class="error-panel">
          <div class="msg display-font">스프레드시트를 불러오지 못했어요.<br>인터넷 연결 또는 시트 공유 설정을 확인해 주세요.</div>
          <button class="retry-btn display-font" id="retryBtn">다시 시도</button>
        </div>`;
      document.getElementById("retryBtn").addEventListener("click", () => loadLauncher(config));
      setStatus("error", "연결 실패");
    }
  }

  /* ---------- 입장 화면: 시트 연결 ---------- */
  entryForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideEntryError();

    const parsed = parseSheetInput(sheetInput.value);
    if (!parsed){
      showEntryError();
      return;
    }

    startBtn.disabled = true;
    startBtn.textContent = "확인 중...";

    try {
      const res = await fetch(csvUrl(parsed.sheetId, parsed.gid), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const rows = parseCSV(text);
      const items = rowsToButtons(rows);
      if (!items.length) throw new Error("empty");

      saveSheet(parsed.sheetId, parsed.gid);
      await loadLauncher(parsed);
    } catch (err){
      showEntryError();
      startBtn.disabled = false;
      startBtn.textContent = "시작하기";
    }
  });

  /* ---------- 다른 시트 사용(초기화) ---------- */
  resetBtn.addEventListener("click", () => {
    const ok = confirm("연결된 시트 정보를 지우고 처음 화면으로 돌아갈까요?");
    if (!ok) return;
    clearSavedSheet();
    grid.classList.add("hidden");
    statusWrap.classList.add("hidden");
    resetBtn.classList.add("hidden");
    grid.innerHTML = "";
    sheetInput.value = "";
    hideEntryError();
    startBtn.disabled = false;
    startBtn.textContent = "시작하기";
    entryView.classList.remove("hidden");
  });

  /* ---------- 미니 매크로 키보드 지원: 1~9 숫자키로 즉시 실행 ---------- */
  window.addEventListener("keydown", (e) => {
    if (entryView && !entryView.classList.contains("hidden")) return;
    const n = parseInt(e.key, 10);
    if (!Number.isNaN(n) && n >= 1 && n <= 9){
      const item = buttonsData.find(b => b.no === n);
      if (item){
        const btnEl = grid.querySelector(`.keycap[data-index="${n}"]`);
        openSite(item, btnEl);
      }
    }
  });

  /* ---------- 시작: 저장된 시트가 있으면 바로 런처 실행 ---------- */
  const saved = loadSavedSheet();
  if (saved && saved.sheetId){
    loadLauncher(saved);
  }
})();
</script>
</body>
</html>
