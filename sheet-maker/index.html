<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>캐릭터 시트 메이커 - v3</title>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>캐릭터 시트 메이커 - v3</h1>
      <div class="progress-bar">
        <div class="progress-step active" data-step="1">1</div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="2">2</div>
        <div class="progress-line"></div>
        <div class="progress-step" data-step="3">3</div>
      </div>
    </header>

    <main class="app-main">
      <!-- STEP 1: 캐릭터 선택 -->
      <section class="step" id="step1" style="display:block;">
        <h2>1단계: 캐릭터 유형 선택</h2>
        <div class="type-cards">
          <button class="type-card" data-type="bow">
            <img src="assets/bow.png" alt="활 사용자">
            <span>활</span>
          </button>
          <button class="type-card" data-type="sword">
            <img src="assets/sword.png" alt="검 사용자">
            <span>검</span>
          </button>
          <button class="type-card" data-type="stick">
            <img src="assets/stick.png" alt="마술봉 사용자">
            <span>마술봉</span>
          </button>
        </div>
      </section>

      <!-- STEP 2: 정보 입력 -->
      <section class="step" id="step2" style="display:none;">
        <div class="step2-container">
          <div class="step2-preview">
            <h2>캐릭터 미리보기</h2>
            <div class="preview-box">
              <img id="previewImage" src="" alt="캐릭터">
            </div>
          </div>

          <div class="step2-form">
            <h2>정보 입력</h2>
            
            <div class="input-group">
              <label for="authorName">작가명</label>
              <input type="text" id="authorName" placeholder="작가 이름을 입력하세요" maxlength="20">
            </div>

            <div class="input-group">
              <label for="jobTitle">직업</label>
              <input type="text" id="jobTitle" placeholder="직업을 입력하세요" maxlength="30">
            </div>

            <div class="input-group">
              <label for="characteristic">특징</label>
              <select id="characteristic">
                <option value="">선택하기...</option>
              </select>
              <input type="text" id="characteristicCustom" placeholder="직접 입력" maxlength="100" style="display:none;">
            </div>

            <div class="step-buttons">
              <button class="btn-secondary" onclick="goToStep(1)">이전</button>
              <button class="btn-primary" id="nextBtn" disabled>다음</button>
            </div>
          </div>
        </div>
      </section>

      <!-- STEP 3: 최종 확인 및 저장 -->
      <section class="step" id="step3" style="display:none;">
        <h2>3단계: 캐릭터 시트 확인</h2>
        <div class="preview-sheet">
          <canvas id="previewCanvas" width="800" height="1280"></canvas>
        </div>
        <div class="step-buttons">
          <button class="btn-secondary" onclick="goToStep(2)">수정</button>
          <button class="btn-primary" id="downloadBtn">📥 PNG로 저장</button>
        </div>
      </section>
    </main>

    <!-- 숨겨진 캔버스 (다운로드용) -->
    <canvas id="downloadCanvas" width="800" height="1280" style="display:none;"></canvas>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
