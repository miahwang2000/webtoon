<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>수업용 퀵 런처</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Special+Elite&display=swap" rel="stylesheet">

<style>
  :root{
    --desk:#4a3222;
    --desk-2:#3a2718;
    --bg:#1b1712;
    --panel:#221c16;
    --panel-2:#171310;
    --keycap-top:#332a20;
    --keycap-top-2:#201a13;
    --keycap-side:#0e0b08;
    --keycap-border: rgba(255,220,160,0.06);
    --brass:#c9a24a;
    --brass-bright:#e8c877;
    --amber:#ffab34;
    --amber-bright:#ffd98a;
    --amber-dim: rgba(255,171,52,0.18);
    --text:#f2e9d8;
    --text-dim:#a89880;
    --danger:#ff7a6b;
    --ok:#8fd18f;
    --radius:18px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(ellipse 1000px 600px at 50% -8%, rgba(255,171,52,0.06), transparent 60%),
      repeating-linear-gradient(100deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px),
      linear-gradient(155deg, var(--desk), var(--desk-2) 55%, #2b1d12 100%);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overflow-x:hidden;
  }

  .display-font{ font-family:'Do Hyeon', -apple-system, "Malgun Gothic", sans-serif; }
  .analog-font{ font-family:'Special Elite', 'Do Hyeon', monospace; }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 20px 22px 6px;
    max-width:1180px; margin:0 auto;
  }
  header h1{
    font-size: clamp(17px, 2.2vw, 22px);
    margin:0; letter-spacing:1.5px; color:var(--brass-bright);
    font-weight:400; text-transform:uppercase;
    text-shadow: 0 1px 0 rgba(0,0,0,0.4);
  }
  .status{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--text-dim);
  }
  .status-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--text-dim);
    transition: background .25s, box-shadow .25s;
  }
  .status-dot.ok{ background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .status-dot.error{ background:var(--danger); box-shadow:0 0 8px var(--danger); }
  .status-dot.loading{ background:var(--amber); box-shadow:0 0 8px var(--amber); animation: pulse 1s infinite ease-in-out; }

  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ---------- Console deck (the "keyboard body" sitting on the desk) ---------- */
  main{
    max-width:1180px; margin:0 auto;
    padding: 14px 22px 44px;
    min-height: calc(100vh - 74px);
    display:flex; align-items:center; justify-content:center;
  }

  .console{
    width:100%;
    background: linear-gradient(170deg, var(--panel), var(--panel-2));
    border-radius: 26px;
    padding: 28px;
    display:flex;
    align-items:stretch;
    gap: 26px;
    position:relative;
    box-shadow:
      0 24px 50px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.04);
  }

  /* clear acrylic edge that catches amber light, like the reference photo */
  .console::before{
    content:"";
    position:absolute; left:14px; right:14px; bottom:-2px; height:6px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    filter: blur(6px);
    opacity:.55;
    border-radius:50%;
  }

  .keys-panel{
    flex: 1 1 auto;
    min-width:0;
  }

  .grid{
    width:100%;
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
  }

  /* ---------- Keycap button ---------- */
  .keycap{
    position:relative;
    appearance:none; border:none; cursor:pointer;
    aspect-ratio: 1 / 0.82;
    min-height:140px;
    border-radius: var(--radius);
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      linear-gradient(160deg, var(--keycap-top), var(--keycap-top-2));
    border: 1px solid var(--keycap-border);
    box-shadow:
      0 8px 0 var(--keycap-side),
      0 14px 22px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,235,200,0.08);
    color: var(--text);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px;
    transition: transform .12s ease, box-shadow .12s ease;
    opacity:0; transform: translateY(10px);
    animation: rise .45s ease forwards;
    animation-delay: calc(var(--i, 0) * 60ms);
  }

  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .keycap::after{
    content:"";
    position:absolute; left:8%; right:8%; bottom:-12px; height:20px;
    background: var(--amber);
    filter: blur(14px);
    opacity:0;
    transition: opacity .18s ease;
    border-radius:50%;
    pointer-events:none;
  }

  .keycap:hover, .keycap:focus-visible{
    transform: translateY(-3px);
    box-shadow:
      0 11px 0 var(--keycap-side),
      0 18px 26px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,235,200,0.1);
  }
  .keycap:hover::after, .keycap:focus-visible::after{ opacity:.5; }
  .keycap:focus-visible{ outline: 2px solid var(--amber-bright); outline-offset:3px; }

  .keycap:active, .keycap.pressed{
    transform: translateY(5px);
    box-shadow:
      0 3px 0 var(--keycap-side),
      0 6px 12px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,235,200,0.1);
  }
  .keycap:active::after, .keycap.pressed::after{ opacity:1; }

  .keycap-number{
    position:absolute; top:11px; left:13px;
    font-family:'Special Elite', monospace;
    font-size:12px; color: var(--amber);
    text-shadow: 0 0 6px var(--amber-dim);
    letter-spacing:0.5px;
  }

  .keycap-icon{
    font-size:32px; line-height:1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }

  .keycap-icon.fallback{
    width:42px; height:42px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    background: var(--amber-dim);
    color: var(--amber-bright);
    font-size:19px;
  }

  .keycap-label{
    font-family:'Do Hyeon', sans-serif;
    font-size: clamp(15px, 1.9vw, 18px);
    letter-spacing:0.3px;
    text-align:center;
    padding: 0 8px;
  }

  /* ---------- Skeleton ---------- */
  .keycap.skeleton{
    cursor:default;
    background: linear-gradient(90deg, var(--keycap-top-2) 25%, var(--keycap-top) 37%, var(--keycap-top-2) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.3s ease-in-out infinite, rise .45s ease forwards;
  }
  @keyframes shimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }

  /* ---------- Error panel ---------- */
  .error-panel{
    grid-column: 1/-1;
    text-align:center;
    padding: 40px 20px;
    color: var(--text-dim);
  }
  .error-panel .msg{
    font-size: clamp(16px,2.2vw,19px);
    color: var(--text);
    margin-bottom: 18px;
    font-family:'Do Hyeon', sans-serif;
  }
  .retry-btn{
    appearance:none; border:none; cursor:pointer;
    background: var(--amber);
    color:#1a1204;
    font-family:'Do Hyeon', sans-serif;
    font-size:16px;
    padding: 12px 28px;
    border-radius: 14px;
    box-shadow: 0 6px 0 #a06d1e, 0 10px 18px rgba(0,0,0,0.4);
    transition: transform .1s ease;
  }
  .retry-btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 #a06d1e; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  @media (max-width: 720px){
    .console{ padding:20px; }
  }

  @media (max-width: 480px){
    .grid{ grid-template-columns: repeat(2, 1fr); gap:12px; }
    .keycap{ min-height:118px; }
  }
</style>
</head>
<body>

<header>
  <h1 class="display-font">퀵 런처</h1>
  <div class="status"><span id="statusDot" class="status-dot loading"></span><span id="statusText" class="analog-font">불러오는 중</span></div>
</header>

<main>
  <div class="console">
    <div class="keys-panel">
      <div class="grid" id="grid">
        <!-- 스켈레톤 6개: 시트 로딩 중 자리 표시 -->
        <button class="keycap skeleton" style="--i:0" disabled aria-hidden="true"></button>
        <button class="keycap skeleton" style="--i:1" disabled aria-hidden="true"></button>
        <button class="keycap skeleton" style="--i:2" disabled aria-hidden="true"></button>
        <button class="keycap skeleton" style="--i:3" disabled aria-hidden="true"></button>
        <button class="keycap skeleton" style="--i:4" disabled aria-hidden="true"></button>
        <button class="keycap skeleton" style="--i:5" disabled aria-hidden="true"></button>
      </div>
    </div>
  </div>
</main>

<script>
(() => {
  "use strict";

  /* =========================================================================
     설정 (CONFIG)
     -------------------------------------------------------------------------
     1) 구글 스프레드시트를 만들고 첫 행(헤더)에 아래 4개 열을 넣으세요:
          번호 | 이름 | URL | 아이콘(선택, 이모지 1개)
     2) 시트 공유 설정을 "링크가 있는 모든 사용자 - 뷰어"로 변경하세요.
     3) 시트 주소창 URL에서 SHEET_ID를 복사해서 아래에 붙여넣으세요.
        예) https://docs.google.com/spreadsheets/d/<이 부분>/edit#gid=0
     4) 탭(시트)이 여러 개라면 GID 숫자를 해당 탭 URL의 gid= 뒤 숫자로 바꾸세요.
     ========================================================================= */
  const CONFIG = {
    SHEET_ID: "1WZD8_ZpG9FCYPGcjFfz4iCC8TpmkxethSoyLxbW5zVs",
    GID: "0",
    get CSV_URL(){
      return `https://docs.google.com/spreadsheets/d/${this.SHEET_ID}/gviz/tq?tqx=out:csv&gid=${this.GID}&_=${Date.now()}`;
    }
  };

  const grid = document.getElementById("grid");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  let buttonsData = []; // [{no, name, url, icon}]

  function setStatus(state, text){
    statusDot.className = "status-dot " + state;
    statusText.textContent = text;
  }

  /* ---------- 아주 작은 CSV 파서 ---------- */
  function parseCSV(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i], next = text[i+1];
      if (inQuotes){
        if (c === '"' && next === '"'){ field += '"'; i++; }
        else if (c === '"'){ inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"'){ inQuotes = true; }
        else if (c === ','){ row.push(field); field = ""; }
        else if (c === '\n' || c === '\r'){
          if (field !== "" || row.length){ row.push(field); rows.push(row); row = []; field = ""; }
          if (c === '\r' && next === '\n') i++;
        } else { field += c; }
      }
    }
    if (field !== "" || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(f => f.trim() !== ""));
  }

  function findCol(header, keywords){
    const lower = header.map(h => h.trim().toLowerCase());
    for (const kw of keywords){
      const idx = lower.findIndex(h => h.includes(kw));
      if (idx !== -1) return idx;
    }
    return -1;
  }

  function rowsToButtons(rows){
    if (!rows.length) return [];
    const header = rows[0];
    const iNo   = findCol(header, ["번호", "no", "number", "num"]);
    const iName = findCol(header, ["이름", "name"]);
    const iUrl  = findCol(header, ["url", "주소", "링크"]);
    const iIcon = findCol(header, ["아이콘", "icon"]);

    const dataRows = rows.slice(1);
    const items = dataRows.map((r, idx) => ({
      no: iNo !== -1 ? parseInt(r[iNo], 10) || (idx + 1) : (idx + 1),
      name: (iName !== -1 ? r[iName] : r[1] || "").trim(),
      url: (iUrl !== -1 ? r[iUrl] : r[2] || "").trim(),
      icon: (iIcon !== -1 ? r[iIcon] : r[3] || "").trim()
    })).filter(item => item.name && item.url);

    items.sort((a, b) => a.no - b.no);
    return items;
  }

  function normalizeUrl(url){
    if (!/^https?:\/\//i.test(url)) return "https://" + url;
    return url;
  }

  function render(items){
    grid.innerHTML = "";

    if (!items.length){
      showError("스프레드시트에서 사이트 목록을 찾지 못했어요.");
      return;
    }

    items.forEach((item, idx) => {
      const btn = document.createElement("button");
      btn.className = "keycap";
      btn.style.setProperty("--i", idx);
      btn.dataset.index = item.no;
      btn.setAttribute("aria-label", `${item.no}번, ${item.name} 열기`);

      const num = document.createElement("span");
      num.className = "keycap-number";
      num.textContent = item.no;

      const icon = document.createElement("span");
      if (item.icon){
        icon.className = "keycap-icon";
        icon.textContent = item.icon;
      } else {
        icon.className = "keycap-icon fallback";
        icon.textContent = item.name.trim().charAt(0);
      }

      const label = document.createElement("span");
      label.className = "keycap-label";
      label.textContent = item.name;

      btn.append(num, icon, label);
      btn.addEventListener("click", () => open(item, btn));
      grid.appendChild(btn);
    });
  }

  function open(item, btnEl){
    if (btnEl){
      btnEl.classList.add("pressed");
      setTimeout(() => btnEl.classList.remove("pressed"), 160);
    }
    window.open(normalizeUrl(item.url), "_blank", "noopener");
  }

  function showError(message){
    grid.innerHTML = `
      <div class="error-panel">
        <div class="msg display-font">${message}<br>인터넷 연결을 확인하거나 선생님께 문의해 주세요.</div>
        <button class="retry-btn display-font" id="retryBtn">다시 시도</button>
      </div>`;
    document.getElementById("retryBtn").addEventListener("click", load);
    setStatus("error", "연결 실패");
  }

  async function load(){
    setStatus("loading", "불러오는 중");
    try {
      const res = await fetch(CONFIG.CSV_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const rows = parseCSV(text);
      const items = rowsToButtons(rows);
      buttonsData = items;
      render(items);
      setStatus("ok", "연결됨");
    } catch (err){
      showError("스프레드시트를 불러오지 못했어요.");
    }
  }

  /* ---------- 미니 매크로 키보드 지원: 1~9 숫자키로 즉시 실행 ---------- */
  window.addEventListener("keydown", (e) => {
    const n = parseInt(e.key, 10);
    if (!Number.isNaN(n) && n >= 1 && n <= 9){
      const item = buttonsData.find(b => b.no === n);
      if (item){
        const btnEl = grid.querySelector(`.keycap[data-index="${n}"]`);
        open(item, btnEl);
      }
    }
  });

  load();
})();
</script>
</body>
</html>
