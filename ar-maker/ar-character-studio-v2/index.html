<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AR 캐릭터 스튜디오</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= START ================= -->
<section id="screen-start" class="screen active">
  <div class="start-card">
    <h1 class="title-crayon">🖍️ AR 캐릭터 스튜디오</h1>
    <p class="subtitle">그림을 그리고, 살아나게 하고, 함께 놀아요!</p>

    <div class="field-row">
      <div class="field">
        <label for="input-name">내 이름</label>
        <input id="input-name" type="text" placeholder="예) 김하늘" maxlength="10">
      </div>
      <div class="field">
        <label for="input-class">반</label>
        <select id="input-class">
          <option value="class_sdD_A">신남초 돌봄A</option>
          <option value="class_sdD_B">신남초돌봄 B</option>
          <option value="class_sd_A">신도림초 A</option>
          <option value="class_sd_B">신도림초 B</option>
          <option value="class_dh_A">등현초A</option>
          <option value="class_dh_B">등현초B</option>
          <option value="class_sn_A">신남초 A</option>
          <option value="class_sn_B">신남초 B</option>
        </select>
      </div>
    </div>

    <div class="guide-picker">
      <label>오늘 그릴 그림을 골라요</label>
      <div class="guide-grid" id="guide-grid"></div>
    </div>

    <button class="btn-crayon" id="btn-start">수업 시작하기</button>
  </div>
</section>

<!-- ================= DRAW ================= -->
<section id="screen-draw" class="screen">
  <div class="canvas-wrap">
    <div class="canvas-stage" id="canvas-stage">
      <div class="canvas-zoom-layer" id="canvas-zoom-layer">
        <canvas id="canvas-guide"></canvas>
        <canvas id="canvas-draw"></canvas>
      </div>
      <div class="zoom-controls">
        <button class="icon-btn" id="btn-zoom-out" title="축소">➖</button>
        <button class="icon-btn" id="btn-zoom-reset" title="원래 크기">🔍</button>
        <button class="icon-btn" id="btn-zoom-in" title="확대">➕</button>
        <button class="icon-btn" id="btn-pan-mode" title="이동하기">✋</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="tool-row" id="tool-row">
      <button class="tool-btn" data-tool="fill" title="채우기"><img src="assets/icons/fill.png" alt="채우기"><span class="color-dot"></span></button>
      <button class="tool-btn" data-tool="marker" title="마커"><img src="assets/icons/marker.png" alt="마커"><span class="color-dot"></span></button>
      <button class="tool-btn" data-tool="pencil" title="색연필"><img src="assets/icons/pencil.png" alt="색연필"><span class="color-dot"></span></button>
      <button class="tool-btn" data-tool="airbrush" title="에어브러시"><img src="assets/icons/airbrush.png" alt="에어브러시"><span class="color-dot"></span></button>
      <button class="tool-btn" data-tool="eraser" title="지우개"><img src="assets/icons/eraser.png" alt="지우개"></button>
      <button class="tool-btn" id="btn-undo" title="되돌리기"><img src="assets/icons/undo.png" alt="되돌리기"></button>
      <button class="tool-btn" id="btn-restart-draw" title="처음으로"><span style="font-size:1.5rem;">🏠</span></button>
    </div>
    <div class="size-row" id="size-row">
      <button class="size-btn" data-size="small"><span class="dot" style="width:8px;height:8px;"></span>작게</button>
      <button class="size-btn" data-size="medium"><span class="dot" style="width:14px;height:14px;"></span>보통</button>
      <button class="size-btn" data-size="large"><span class="dot" style="width:20px;height:20px;"></span>크게</button>
    </div>
  </div>

  <div class="bottom-actions">
    <button class="btn-crayon" id="btn-alive">✨ 살아나기!</button>
    <button class="btn-crayon secondary" id="btn-minigame-draw">🏃 미니게임 하기</button>
  </div>
</section>

<!-- Color picker popup (opens from marker/pencil/airbrush/fill) -->
<div class="modal-overlay" id="color-popup">
  <div class="modal-card color-card">
    <h3 style="margin-top:0;">🎨 색깔 고르기</h3>
    <div class="palette-row" id="palette-row"></div>
  </div>
</div>

<!-- ================= AR ================= -->
<section id="screen-ar" class="screen">
  <video id="ar-video" autoplay muted playsinline></video>

  <div class="ar-topbar">
    <button class="icon-btn" id="btn-back-to-draw" title="그림으로 돌아가기">🎨</button>
  </div>

  <div id="ar-hint" class="hint-bubble">화면을 톡 치면 그쪽으로 와요! 두 번 톡 = 점프, 길게 누르면 춤 💃</div>

  <div class="character-wrap" id="character-wrap">
    <div class="spawn-flash" id="spawn-flash"></div>
    <div class="shadow" id="char-shadow"></div>
    <div class="character idle" id="character">
      <img id="character-img" src="" alt="내 캐릭터" draggable="false">
    </div>
  </div>

  <div class="ar-controls">
    <button class="ar-round-btn" id="btn-feed" title="먹이 주기">🍖</button>
    <button class="ar-round-btn shutter" id="btn-photo" title="사진 찍기">📷</button>
    <button class="ar-round-btn" id="btn-switch-camera" title="카메라 전환">🔄</button>
    <button class="ar-round-btn" id="btn-to-minigame" title="미니게임">🏃</button>
    <button class="ar-round-btn" id="btn-restart-ar" title="다음 수업">🏠</button>
  </div>

  <canvas id="capture-canvas" style="display:none;"></canvas>
</section>

<!-- Photo preview modal -->
<div class="modal-overlay" id="photo-modal">
  <div class="modal-card">
    <h3 style="margin-top:0;">📸 사진이 완성됐어요!</h3>
    <img id="photo-preview" src="" alt="촬영한 사진" draggable="false">
    <p class="submit-status" id="submit-status"></p>
    <div class="modal-actions">
      <button class="btn-crayon small" id="btn-submit-photo">🎁 선생님께 제출하기</button>
      <button class="btn-crayon small secondary" id="btn-retake">다시 찍기</button>
    </div>
  </div>
</div>

<!-- ================= MINI GAME ================= -->
<section id="screen-game" class="screen">
  <div class="game-wrap">
    <div class="game-stage" id="game-stage">
      <canvas id="game-canvas"></canvas>

      <div class="game-hud">
        <div class="score-pill">🏆 <span id="game-best">0</span></div>
        <div class="score-pill" id="game-lives">❤️❤️❤️</div>
        <div class="score-pill main">⭐ <span id="game-score">0</span></div>
      </div>

      <div class="game-overlay" id="game-ready-overlay">
        <div class="game-panel">
          <h3>🏃 달려라!</h3>
          <p>화면을 누르고 있으면 둥실 떠오르고,<br>손을 떼면 내려와요.<br>⭐ 별을 모으면 점수가 올라가고,<br>❤️ 목숨은 3개! 부딪혀도 2번 더 도전할 수 있어요.</p>
          <button class="btn-crayon" id="btn-game-start">시작하기</button>
        </div>
      </div>

      <div class="game-overlay" id="game-over-overlay" style="display:none;">
        <div class="game-panel">
          <h3>🏁 게임 종료!</h3>
          <p id="game-final-score">점수: 0</p>
          <div class="modal-actions">
            <button class="btn-crayon small" id="btn-game-retry">다시하기</button>
            <button class="btn-crayon small secondary" id="btn-game-exit">그만하기</button>
          </div>
        </div>
      </div>
    </div>
    <button class="icon-btn" id="btn-restart-game" title="처음으로">🏠</button>
  </div>
</section>

<script src="js/storage.js"></script>
<script src="js/classroom-input-guard.js"></script>
<script src="js/draw.js"></script>
<script src="js/ar.js"></script>
<script src="js/cloudinary.js"></script>
<script src="js/minigame.js"></script>
<script src="js/app.js"></script>
</body>
</html>
