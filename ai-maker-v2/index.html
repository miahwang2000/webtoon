<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>캐릭터 만들기 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- 상단: 제목 + 스탬프 진행표시 (수업 시작 전에는 숨김) -->
  <header class="topbar" id="topbar" style="display:none;">
    <div class="brand">
      <span class="brand-mark">✏️</span>
      <h1>캐릭터 만들기 공방</h1>
    </div>
    <ol class="stamps" id="stamps">
      <li data-step="1" class="stamp active"><span class="stamp-icon">🖍️</span><span class="stamp-label">스케치</span></li>
      <li data-step="2" class="stamp"><span class="stamp-icon">🎨</span><span class="stamp-label">채색</span></li>
      <li data-step="3" class="stamp"><span class="stamp-icon">📋</span><span class="stamp-label">캐릭터 시트</span></li>
      <li data-step="4" class="stamp"><span class="stamp-icon">📮</span><span class="stamp-label">제출</span></li>
    </ol>
  </header>

  <main class="stage">

    <!-- 시작 화면: 이름/반 선택 후 수업 시작 (전체화면은 여기서 이 버튼 클릭으로 진입) -->
    <section class="screen active" id="screen-start">
      <div class="start-brand">
        <span class="brand-mark">✏️</span>
        <h1>캐릭터 만들기 공방</h1>
      </div>
      <div class="panel-title">
        <h2>수업을 시작해요</h2>
        <p>이름과 반을 선택하고 수업 시작 버튼을 눌러주세요.</p>
      </div>

      <div class="field-group">
        <label for="studentNameInput">이름</label>
        <input type="text" id="studentNameInput" placeholder="내 이름을 입력하세요">
      </div>

      <div class="field-group">
        <label for="studentClassSelect">반 선택</label>
        <select id="studentClassSelect">
          <option value="">반을 선택하세요</option>
          <option value="신남초 돌봄A">신남초 돌봄A</option>
          <option value="신남초 돌봄B">신남초 돌봄B</option>
          <option value="신도림초 A">신도림초 A</option>
          <option value="신도림초 B">신도림초 B</option>
          <option value="등현초A">등현초A</option>
          <option value="등현초B">등현초B</option>
          <option value="신남초 A">신남초 A</option>
          <option value="신남초 B">신남초 B</option>
        </select>
      </div>

      <div class="step-actions">
        <button class="btn primary big" id="btn-start-class">🚀 수업 시작하기</button>
      </div>
    </section>

    <!-- STEP 1: 가이드 따라 그리기 -->
    <section class="screen" id="screen-1">
      <div class="panel-title">
        <h2>1. 가이드를 따라 그려봐요</h2>
      </div>

      <div class="guide-picker" id="guidePicker"></div>

      <div class="canvas-wrap">
        <div class="canvas-viewport" id="viewport-sketch">
          <div class="sketch-canvas-stack" id="zoomTarget-sketch">
            <canvas id="guideCanvas" width="600" height="600"></canvas>
            <canvas id="sketchCanvas" width="600" height="600"></canvas>
            <div class="brush-cursor" id="sketchBrushCursor"></div>
          </div>
        </div>
        <div class="canvas-tools">
          <button class="tool-btn icon-only" id="zoom-out-sketch" aria-label="축소">➖</button>
          <button class="tool-btn icon-only" id="zoom-reset-sketch" aria-label="원래 크기">🔍</button>
          <button class="tool-btn icon-only" id="zoom-in-sketch" aria-label="확대">➕</button>
          <button class="tool-btn icon-only" id="btn-pan-sketch" aria-label="화면 이동">✋</button>
          <button class="tool-btn icon-only" id="tool-pen" data-tool="pen" aria-label="펜">🖊️</button>
          <button class="tool-btn icon-only" id="tool-eraser" data-tool="eraser" aria-label="지우개">🧽</button>
          <button class="tool-btn icon-only" id="btn-undo-sketch" aria-label="실행 취소">↩️</button>
          <button class="tool-btn icon-only danger" id="btn-clear-sketch" aria-label="전체 지우기">🗑️</button>
          <button class="tool-btn icon-only" id="btn-toggle-guide" aria-label="가이드 숨기기">👁️</button>
        </div>
      </div>

      <div class="step-actions">
        <button class="btn primary big" id="btn-to-color">채색하러 가기 →</button>
      </div>
    </section>

    <!-- STEP 2: 채색 -->
    <section class="screen" id="screen-2">
      <div class="panel-title">
        <h2>2. 색을 칠해봐요</h2>
        <p>끊어진 선이 있으면 "펜"으로 먼저 이어준 다음, "채우기"로 색을 칠하세요.</p>
      </div>

      <div class="canvas-wrap">
        <div class="canvas-viewport" id="viewport-color">
          <div class="color-canvas-stack" id="zoomTarget-color">
            <canvas id="colorCanvas" width="600" height="600"></canvas>
            <div class="brush-cursor" id="colorBrushCursor"></div>
          </div>
        </div>
        <div class="canvas-tools">
          <button class="tool-btn icon-only" id="zoom-out-color" aria-label="축소">➖</button>
          <button class="tool-btn icon-only" id="zoom-reset-color" aria-label="원래 크기">🔍</button>
          <button class="tool-btn icon-only" id="zoom-in-color" aria-label="확대">➕</button>
          <button class="tool-btn icon-only" id="btn-pan-color" aria-label="화면 이동">✋</button>
          <button class="tool-btn active" id="mode-fill" data-mode="fill">🪣 채우기</button>
          <button class="tool-btn" id="mode-pen" data-mode="pen">🖊️ 펜</button>
          <button class="tool-btn" id="btn-undo-color">↩️ 실행 취소</button>
          <button class="tool-btn danger" id="btn-reset-color">🗑️ 초기화</button>
        </div>
      </div>

      <div class="palette" id="palette"></div>
      <input type="color" id="customColorInput" value="#ff6b6b" class="hidden-color-input">

      <div class="step-actions">
        <button class="btn ghost" id="btn-back-to-sketch">← 뒤로</button>
        <button class="btn ghost" id="btn-restart-all">처음부터 다시</button>
        <button class="btn primary big" id="btn-save-color">저장하고 다음 →</button>
      </div>
    </section>

    <!-- STEP 3: 캐릭터 시트 -->
    <section class="screen" id="screen-3">
      <div class="panel-title">
        <h2>3. 캐릭터 시트를 완성해요</h2>
      </div>

      <div class="sheet">
        <div class="sheet-left">
          <div class="sheet-canvas-wrap" id="sheetCanvasWrap">
            <canvas id="sheetCanvas" width="600" height="600"></canvas>
            <div class="bubble-layer" id="bubbleLayer"></div>
          </div>
          <button class="btn ghost small" id="btn-add-bubble">💬 말풍선 추가</button>
        </div>

        <div class="sheet-right">
          <div class="field-group">
            <label for="authorInput">작가 이름</label>
            <input type="text" id="authorInput" placeholder="내 이름">
          </div>
          <div class="field-group">
            <label for="charNameInput">캐릭터 이름</label>
            <input type="text" id="charNameInput" placeholder="캐릭터 이름">
          </div>

          <div class="field-group">
            <label for="personalitySelect">성격</label>
            <select id="personalitySelect" data-target="personality">
              <option value="">선택하세요</option>
              <option value="용감한">용감한</option>
              <option value="장난꾸러기">장난꾸러기</option>
              <option value="친절한">친절한</option>
              <option value="호기심 많은">호기심 많은</option>
              <option value="__custom__">✏️ 직접입력</option>
            </select>
            <input type="text" class="custom-input" id="personalityCustom" placeholder="직접 입력해보세요" style="display:none;">
          </div>

          <div class="field-group">
            <label for="strengthSelect">강점</label>
            <select id="strengthSelect" data-target="strength">
              <option value="">선택하세요</option>
              <option value="힘이 세다">힘이 세다</option>
              <option value="빠르다">빠르다</option>
              <option value="똑똑하다">똑똑하다</option>
              <option value="친구가 많다">친구가 많다</option>
              <option value="__custom__">✏️ 직접입력</option>
            </select>
            <input type="text" class="custom-input" id="strengthCustom" placeholder="직접 입력해보세요" style="display:none;">
          </div>

          <div class="field-group">
            <label for="weaknessSelect">약점</label>
            <select id="weaknessSelect" data-target="weakness">
              <option value="">선택하세요</option>
              <option value="겁이 많다">겁이 많다</option>
              <option value="느리다">느리다</option>
              <option value="잘 삐친다">잘 삐친다</option>
              <option value="길치다">길치다</option>
              <option value="__custom__">✏️ 직접입력</option>
            </select>
            <input type="text" class="custom-input" id="weaknessCustom" placeholder="직접 입력해보세요" style="display:none;">
          </div>
        </div>
      </div>

      <div class="step-actions">
        <button class="btn ghost" id="btn-back-to-color">← 뒤로</button>
        <button class="btn primary big" id="btn-to-submit">완성하러 가기 →</button>
      </div>
    </section>

    <!-- STEP 4: 제출 -->
    <section class="screen" id="screen-4">
      <div class="panel-title">
        <h2>4. 완성! 선생님께 제출해요</h2>
      </div>

      <div class="final-preview">
        <canvas id="finalCanvas" width="900" height="600"></canvas>
      </div>

      <div class="step-actions column">
        <button class="btn primary big" id="btn-submit">📮 선생님에게 제출하기</button>
        <p class="submit-status" id="submitStatus"></p>
        <button class="btn ghost" id="btn-new-character">🆕 새 캐릭터 만들기</button>
      </div>
    </section>

  </main>
</div>

<div id="toast"></div>

<!-- 전체화면 유지를 위한 커스텀 확인창 (브라우저 기본 confirm()은 전체화면을 강제 해제시킴) -->
<div class="modal-overlay" id="confirmModalOverlay">
  <div class="modal-box">
    <p id="confirmModalMessage"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="confirmModalCancel">취소</button>
      <button class="btn primary" id="confirmModalOk">확인</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="classroom-input-guard.js"></script>
<script src="app.js"></script>
</body>
</html>
