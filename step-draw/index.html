<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>바다생물 그리기 클래스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --sea-deep:#0f5e8c;
    --sea-mid:#2f9bd6;
    --sea-light:#8fd9f0;
    --sea-foam:#eaf9ff;
    --sand:#fff6e6;
    --ink:#22343f;
    --coral:#ff8a65;
    --coral-dark:#e8623f;
    --good:#3bb273;
    --shadow: 0 6px 0 rgba(15,94,140,0.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Jua','Gaegu',sans-serif;
    background:var(--sea-foam);
    color:var(--ink);
    touch-action:pinch-zoom;
    user-select:none; -webkit-user-select:none;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  .screen{
    position:absolute; inset:0; display:none; flex-direction:column;
    background:var(--sea-foam);
  }
  .screen.active{display:flex;}

  /* ---------- 공용 버튼 ---------- */
  .btn{
    font-family:inherit; font-size:20px; font-weight:700;
    border:none; border-radius:16px; padding:14px 22px;
    cursor:pointer; color:#fff; background:var(--sea-mid);
    box-shadow: var(--shadow);
    transition: transform .08s ease;
  }
  .btn:active{ transform: translateY(4px); box-shadow:0 2px 0 rgba(15,94,140,0.25); }
  .btn.big{ font-size:28px; padding:20px 40px; border-radius:22px; }
  .btn.coral{ background:var(--coral); box-shadow:0 6px 0 rgba(232,98,63,0.35); }
  .btn.coral:active{ box-shadow:0 2px 0 rgba(232,98,63,0.35); }
  .btn.ghost{ background:#fff; color:var(--sea-deep); border:3px solid var(--sea-mid); box-shadow:none; padding-top:11px; padding-bottom:11px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.full{ width:100%; }
  .icon-btn{
    width:52px; height:52px; border-radius:14px; border:none;
    background:#fff; color:var(--sea-deep); font-size:24px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 rgba(15,94,140,0.18); cursor:pointer;
  }
  .icon-btn:active{ transform:translateY(3px); box-shadow:none; }
  .icon-btn:disabled{ opacity:.35; }

  /* ---------- 1. 입장 화면 ---------- */
  #screen-entry{
    align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.5), transparent 40%),
      linear-gradient(180deg, var(--sea-light) 0%, var(--sea-mid) 55%, var(--sea-deep) 100%);
    padding:24px;
  }
  #screen-quiz{
    align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.5), transparent 40%),
      linear-gradient(180deg, var(--sea-light) 0%, var(--sea-mid) 55%, var(--sea-deep) 100%);
    padding:24px;
  }
  .entry-card{
    width:100%; max-width:520px; background:var(--sand);
    border-radius:28px; padding:32px 28px; box-shadow:0 14px 0 rgba(15,94,140,0.3);
    max-height:94vh; overflow-y:auto;
  }
  .entry-title{
    font-family:'Jua',sans-serif; font-size:30px; text-align:center;
    color:var(--sea-deep); margin:0 0 6px;
  }
  .entry-sub{ text-align:center; color:#6b5a44; font-size:17px; margin:0 0 22px; }
  .field-label{ font-size:18px; font-weight:700; margin:16px 0 8px; color:var(--sea-deep); }
  .field-label:first-of-type{ margin-top:0; }
  #nameInput{
    width:100%; font-family:inherit; font-size:22px; padding:14px 16px;
    border-radius:14px; border:3px solid #e0d3b8; background:#fff;
  }
  #nameInput:focus{ outline:none; border-color:var(--sea-mid); }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  select.pill-select{
    width:100%; font-family:inherit; font-size:19px; padding:12px 10px;
    border-radius:14px; border:3px solid #e0d3b8; background:#fff; color:var(--ink);
  }
  #startBtn{ width:100%; margin-top:24px; }

  /* ---------- 퀴즈 ---------- */
  .quiz-question{ font-size:20px; font-weight:700; margin:6px 0 18px; color:var(--ink); line-height:1.5; text-align:center; }
  .quiz-options-mc{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .quiz-options-ox{ display:flex; gap:12px; }
  .quiz-option-btn{
    font-family:inherit; font-size:18px; font-weight:700; padding:16px 10px;
    border-radius:16px; border:3px solid #e0d3b8; background:#fff; cursor:pointer; color:var(--ink);
  }
  .quiz-option-btn.ox{ flex:1; font-size:34px; padding:22px 10px; }
  .quiz-option-btn.correct{ background:#e5f7ec; border-color:var(--good); color:#1f7a4d; }
  .quiz-option-btn.wrong{ background:#ffece8; border-color:var(--coral-dark); color:var(--coral-dark); }
  .quiz-option-btn:disabled{ cursor:default; opacity:0.85; }
  .quiz-feedback{ margin-top:16px; font-size:19px; font-weight:700; text-align:center; min-height:28px; }
  .quiz-feedback.correct{ color:var(--good); }
  .quiz-feedback.wrong{ color:var(--coral-dark); }
  .quiz-result-emoji{ font-size:56px; text-align:center; margin-bottom:6px; }
  .quiz-result-score{ font-size:24px; text-align:center; font-weight:700; color:var(--sea-deep); margin-bottom:6px; }

  /* ---------- 2. 작업 화면 ---------- */
  #screen-work{ background:var(--sea-foam); }
  .work-topbar{
    display:flex; align-items:center; padding:8px 12px; gap:8px;
    background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.06); z-index:5;
  }
  .topbar-group{ display:flex; gap:8px; align-items:center; }
  .topbar-tools{
    gap:6px; flex-wrap:nowrap; padding:2px; min-width:0;
  }
  .topbar-tools .icon-btn{ width:44px; height:44px; font-size:20px; flex:0 0 auto; }
  .icon-btn-wrap{ position:relative; flex:0 0 auto; }
  .icon-btn.on{ background:var(--coral); color:#fff; }
  .reset-btn-orange{ background:var(--coral); color:#fff; }
  .reset-btn-orange:active{ background:var(--coral-dark); }
  .icon-img{ width:26px; height:26px; object-fit:contain; }
  .pen-dot{ background:currentColor; border-radius:50%; display:block; }

  .icon-popover{
    position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:#fff; border-radius:16px; box-shadow:0 10px 24px rgba(0,0,0,0.2);
    padding:10px; z-index:30; display:none; min-width:170px;
  }
  .icon-popover.show{ display:block; }
  .icon-popover .panel-char-list{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:180px; }
  .step-indicator{
    flex:1; text-align:center; display:flex; gap:6px; align-items:center; justify-content:center;
    font-size:17px; font-weight:700; color:var(--sea-deep);
  }
  .dot{ width:12px; height:12px; border-radius:50%; background:#dbe9ef; }
  .dot.on{ background:var(--coral); }

  .work-main{ flex:1; display:flex; min-height:0; }

  .canvas-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:8px; min-height:0; min-width:0; position:relative;
  }
  #canvasStage{
    position:relative; background:#fff; border-radius:20px;
    box-shadow:0 8px 24px rgba(15,94,140,0.18);
    touch-action:pinch-zoom;
  }
  #canvasStage canvas, #canvasStage img.guideImg{
    position:absolute; inset:0; width:100%; height:100%;
  }
  #guideImg{ opacity:0.32; pointer-events:none; z-index:2; }
  #drawCanvas{ touch-action:pinch-zoom; z-index:1; }
  #fillCanvas{ z-index:1; }
  #lineArtCanvas{ z-index:2; pointer-events:none; }
  #decoCanvas{ z-index:3; pointer-events:none; }
  #colorClickLayer{ z-index:4; position:absolute; inset:0; display:none; }

  .empty-theme-msg{
    text-align:center; color:#6b8ea3; font-size:20px; background:#fff;
    border-radius:20px; padding:40px 24px; max-width:340px;
  }

  /* ---------- 동물 고르기 팝오버 안 그리드 ---------- */
  .panel-char-list{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .panel-char-card{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    aspect-ratio:1/1; border-radius:14px; border:3px solid #eef4f7;
    padding:4px; cursor:pointer; background:#fff;
  }
  .panel-char-card.active{ border-color:var(--coral); background:#fff1ea; }
  .panel-char-card img{ width:62%; height:62%; object-fit:contain; }
  .panel-char-card span{
    font-family:'Dotum','돋움','Gulim','굴림',sans-serif;
    font-size:11px; font-weight:700; color:var(--sea-deep); line-height:1.1; text-align:center;
    -webkit-font-smoothing:none; font-smooth:never; text-rendering:optimizeSpeed;
  }

  .brush-sizes{ display:flex; gap:10px; }
  .brush-dot-btn{
    width:46px; height:46px; border-radius:50%; border:3px solid #e2eef3; background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .brush-dot-btn.on{ border-color:var(--coral); }
  .brush-dot-btn span{ background:var(--ink); border-radius:50%; display:block; }

  .palette-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  #fillColorPopover{ min-width:220px; }
  .swatch{
    width:100%; aspect-ratio:1/1; border-radius:50%; border:3px solid #fff;
    box-shadow:0 0 0 2px #e2eef3; cursor:pointer;
  }
  .swatch.on{ box-shadow:0 0 0 3px var(--coral); }
  .swatch-rainbow{
    position:relative; overflow:hidden;
    background:conic-gradient(#ff3b3b,#ffcf3b,#7bde4a,#3bd6ff,#3b6bff,#a13bff,#ff3b9d,#ff3b3b);
  }
  .swatch-rainbow input[type="color"]{
    position:absolute; inset:0; width:100%; height:100%; border:none; padding:0;
    opacity:0; cursor:pointer;
  }


  /* ---------- 3. 완료 화면 ---------- */
  #screen-done{ align-items:center; justify-content:center; text-align:center; padding:24px;
    background: linear-gradient(180deg, var(--sea-light) 0%, var(--sea-mid) 100%); }
  .done-card{ background:#fff; border-radius:28px; padding:36px 28px; max-width:420px; box-shadow:0 14px 0 rgba(15,94,140,0.3); }
  .done-card img{ width:220px; margin-bottom:14px; border-radius:12px; }
  .done-title{ font-family:'Jua',sans-serif; font-size:28px; color:var(--sea-deep); margin:0 0 8px; }
  .done-actions{ display:flex; flex-direction:column; gap:12px; margin-top:20px; }

  /* ---------- 커스텀 모달 (alert/confirm 대체) ---------- */
  #modalOverlay{
    position:fixed; inset:0; background:rgba(15,40,55,0.55);
    display:none; align-items:center; justify-content:center; z-index:999; padding:24px;
  }
  #modalOverlay.active{ display:flex; }
  .modal-box{ background:#fff; border-radius:22px; padding:28px 24px; max-width:360px; text-align:center; }
  .modal-msg{ font-size:20px; margin-bottom:20px; color:var(--ink); line-height:1.5; }
  .modal-actions{ display:flex; gap:10px; justify-content:center; }

  /* ---------- 로딩 오버레이 ---------- */
  #loadingOverlay{
    position:fixed; inset:0; background:rgba(15,40,55,0.75); color:#fff;
    display:none; align-items:center; justify-content:center; z-index:1000; font-size:22px; flex-direction:column; gap:14px;
  }
  #loadingOverlay.active{ display:flex; }
  .spinner{ width:48px; height:48px; border-radius:50%; border:6px solid rgba(255,255,255,0.3); border-top-color:#fff; animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- 4. 미니게임: 두더지 잡기 ---------- */
  #screen-game{ background: linear-gradient(180deg, #7fd8ff 0%, #2f9bd6 55%, #0f5e8c 100%); overflow:hidden; }
  .game-topbar{
    display:flex; justify-content:center; gap:14px; padding:12px;
    background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.08); z-index:2;
  }
  .game-stat{
    font-size:18px; font-weight:700; color:var(--sea-deep);
    background:var(--sea-foam); border-radius:14px; padding:8px 14px;
  }
  .mole-field{ flex:1; display:flex; align-items:center; justify-content:center; padding:16px; min-height:0; }
  .mole-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
    width:100%; max-width:520px; aspect-ratio:1/1;
  }
  .mole-hole{
    position:relative; border-radius:50%; overflow:hidden;
    background: radial-gradient(circle at 50% 65%, #9a6a3c 0%, #6b4423 60%, #4a2f18 100%);
    box-shadow: inset 0 6px 10px rgba(0,0,0,0.35);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .mole-img{
    width:91%; aspect-ratio:1/1; object-fit:contain;
    transform:translateY(105%); transition: transform .16s ease-out;
    cursor:pointer; filter:drop-shadow(0 4px 4px rgba(0,0,0,0.25));
    touch-action:none;
  }
  .mole-img.up{ transform:translateY(4%); }
  .mole-img.caught{ animation:mole-hit .3s ease-out forwards; }
  @keyframes mole-hit{
    0%{ transform:translateY(4%) scale(1); filter:brightness(1) saturate(1); }
    20%{ transform:translateY(-2%) scale(1.3); filter:brightness(1.5) saturate(1.4); }
    100%{ transform:translateY(105%) scale(0.3) rotate(15deg); opacity:0; filter:brightness(1) saturate(1); }
  }

  /* 남은 시간이 10초 이하일 때 상단에 뜨는 작은 카운트다운 창 */
  .countdown-popup{
    position:absolute; top:76px; left:50%; transform:translateX(-50%) scale(0.8);
    width:64px; height:64px; border-radius:50%; background:var(--coral); color:#fff;
    font-family:'Jua',sans-serif; font-size:32px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(0,0,0,0.28); opacity:0; pointer-events:none; z-index:4;
    transition:opacity .2s ease, transform .2s ease;
  }
  .countdown-popup.show{ opacity:1; animation:countdown-pulse 1s ease-in-out infinite; }
  @keyframes countdown-pulse{
    0%,100%{ transform:translateX(-50%) scale(1); }
    50%{ transform:translateX(-50%) scale(1.14); }
  }

  /* 좌우에서 천천히 떠오르는 물방울 */
  .bubble-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .bubble{
    position:absolute; bottom:-10%; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.18) 65%, rgba(255,255,255,0.05) 100%);
    animation: bubble-rise linear forwards;
  }
  @keyframes bubble-rise{
    0%{ transform:translateY(0); opacity:0; }
    10%{ opacity:0.85; }
    88%{ opacity:0.6; }
    100%{ transform:translateY(-120vh); opacity:0; }
  }

  /* 뽕망치 커서: 제공된 이미지의 망치머리 중심(타격 지점)을 실제 커서 좌표에 고정하고
     그 지점을 축으로 회전만 시켜서, 회전해도 좌표가 절대 어긋나지 않게 함 */
  #screen-game.hammer-mode, #screen-game.hammer-mode *{ cursor:none; }
  .hammer-cursor{
    position:fixed; top:0; left:0; width:84px; height:auto;
    pointer-events:none; z-index:50; opacity:0;
    transform-origin:51.3% 34.8%;
    transform:translate(-51.3%, -34.8%) rotate(-80deg);
    transition:opacity .12s ease;
  }
  .hammer-cursor.visible{ opacity:1; }
  .hammer-cursor.swing{ animation:hammer-swing .24s cubic-bezier(.4,0,.2,1); }
  @keyframes hammer-swing{
    0%{   transform:translate(-51.3%, -34.8%) rotate(-80deg); }
    40%{  transform:translate(-51.3%, -34.8%) rotate(-109deg); }
    70%{  transform:translate(-51.3%, -34.8%) rotate(-95deg); }
    100%{ transform:translate(-51.3%, -34.8%) rotate(-80deg); }
  }

  /* 타격 시 은은하게 퍼지는 노란빛 */
  .hammer-glow{
    position:fixed; top:0; left:0; width:120px; height:70px;
    transform:translate(-50%, -35%) scale(0.6);
    border-radius:50%;
    background: radial-gradient(ellipse at center, rgba(255,235,110,0.9) 0%, rgba(255,220,70,0.45) 45%, rgba(255,220,70,0) 75%);
    filter: blur(1.5px);
    pointer-events:none; z-index:49; opacity:0;
  }
  .hammer-glow.flash{ animation: glow-flash .32s ease-out; }
  @keyframes glow-flash{
    0%{   opacity:0;    transform:translate(-50%, -35%) scale(0.5); }
    35%{  opacity:1;    transform:translate(-50%, -35%) scale(1.2); }
    100%{ opacity:0;    transform:translate(-50%, -35%) scale(1.4); }
  }

  .game-overlay{
    position:absolute; inset:0; background:rgba(15,40,55,0.6);
    display:flex; align-items:center; justify-content:center; padding:24px; z-index:5;
  }
  .game-overlay.hidden{ display:none; }
  .game-overlay-card{ background:#fff; border-radius:26px; padding:32px 26px; max-width:360px; text-align:center; box-shadow:0 14px 0 rgba(15,94,140,0.3); }
  .game-overlay-title{ font-family:'Jua',sans-serif; font-size:26px; color:var(--sea-deep); margin:0 0 10px; }
  .game-overlay-desc{ color:#6b8ea3; font-size:18px; margin:0 0 4px; }

  @media (max-width:480px){
    .entry-title{ font-size:25px; }
    .btn.big{ font-size:22px; padding:16px 28px; }
    .palette-grid{ grid-template-columns:repeat(3,1fr); } /* 좁은 화면에서는 스와치를 키워 터치하기 쉽게 */
  }

  /* 폭이 좁아지면 상단 메뉴를 2단으로: 1단(홈/전체지우기 - 단계표시 - 다음단계), 2단(도구 아이콘들) */
  @media (max-width:640px){
    .work-topbar{ flex-wrap:wrap; row-gap:6px; }
    .topbar-left{ order:0; }
    .step-indicator{ order:1; flex:1 1 auto; }
    .topbar-right{ order:2; }
    .topbar-tools{ order:3; flex:1 1 100%; flex-wrap:wrap; justify-content:center; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- 1. 입장 화면 -->
  <section id="screen-entry" class="screen active">
    <div class="entry-card">
      <p class="entry-title">🐧 바다생물 그리기 클래스</p>
      <p class="entry-sub">이름과 반, 주제를 선택하고 시작해요</p>

      <div class="field-label">이름</div>
      <input id="nameInput" type="text" placeholder="이름을 입력하세요" maxlength="10">

      <div class="field-label">학교 / 반</div>
      <div class="row-2">
        <select id="schoolSelect" class="pill-select">
          <option value="신도림초">신도림초</option>
          <option value="등현초">등현초</option>
          <option value="신남초">신남초</option>
        </select>
        <select id="classSelect" class="pill-select">
          <option value="A">A반</option>
          <option value="B">B반</option>
        </select>
      </div>

      <div class="field-label">오늘의 주제</div>
      <select id="themeSelect" class="pill-select">
        <option value="sea">🌊 바다생물 그리기</option>
        <option value="misc">🎨 여러가지 그리기</option>
      </select>

      <button id="quizBtn" class="btn ghost full" style="margin-top:14px;">🧠 오늘의 퀴즈 풀어보기</button>

      <button id="startBtn" class="btn coral big">수업 시작하기</button>
    </div>
  </section>

  <!-- 1-b. 퀴즈 화면 -->
  <section id="screen-quiz" class="screen">
    <div class="entry-card" style="max-width:480px;">
      <p class="entry-title" id="quizTitle">🧠 오늘의 퀴즈</p>
      <p class="entry-sub" id="quizProgress">1 / 5 문제</p>

      <div id="quizBody"></div>

      <div class="done-actions" id="quizActions" style="margin-top:22px;"></div>
    </div>
  </section>

  <!-- 2. 작업 화면 (따라그리기 + 색칠, 전부 상단바) -->
  <section id="screen-work" class="screen">
    <div class="work-topbar">
      <div class="topbar-group topbar-left">
        <button class="icon-btn" id="backToEntryBtn" title="처음으로">🏠</button>
        <button class="icon-btn" id="resetBtn" title="전체 지우기">🔄</button>
      </div>
      <div class="step-indicator" id="stepIndicator"></div>

      <!-- 선 그리기 단계 도구 -->
      <div class="topbar-group topbar-tools" id="drawToolbar">
        <div class="icon-btn-wrap">
          <button class="icon-btn" id="charPickerBtn" title="동물 고르기">🐾</button>
          <div class="icon-popover" id="charPickerPopover">
            <div class="panel-char-list" id="panelCharList"></div>
          </div>
        </div>
        <div class="icon-btn-wrap">
          <button class="icon-btn" id="penSizeBtn" title="길게 눌러 펜 굵기 선택"><span class="pen-dot" id="penDotIcon"></span></button>
          <div class="icon-popover" id="penSizePopover">
            <div class="brush-sizes">
              <button class="brush-dot-btn" data-size="6"><span style="width:8px;height:8px;"></span></button>
              <button class="brush-dot-btn on" data-size="10"><span style="width:13px;height:13px;"></span></button>
              <button class="brush-dot-btn" data-size="16"><span style="width:19px;height:19px;"></span></button>
            </div>
          </div>
        </div>
        <button class="icon-btn on" id="penDrawBtn" title="그리기">✏️</button>
        <button class="icon-btn" id="eraserBtn" title="지우개"><img src="assets/ui/eraser.png" alt="지우개" class="icon-img"></button>
        <button class="icon-btn on" id="snapBtn" title="가이드 스냅">🧲</button>
        <button class="icon-btn" id="drawUndoBtn" title="되돌리기">↩️</button>
      </div>

      <!-- 색칠 단계 도구 -->
      <div class="topbar-group topbar-tools" id="colorToolbar" style="display:none;">
        <div class="icon-btn-wrap">
          <button class="icon-btn on" id="fillToolBtn" title="채우기 (색 고르기)"><img src="assets/ui/fill.png" alt="채우기" class="icon-img"></button>
          <div class="icon-popover" id="fillColorPopover">
            <div class="palette-grid" id="paletteGrid"></div>
          </div>
        </div>
        <button class="icon-btn" id="penToolBtn" title="그리기 (검정선 고정)">✏️</button>
        <button class="icon-btn" id="eraseToolBtn" title="지우개"><img src="assets/ui/eraser.png" alt="지우개" class="icon-img"></button>
        <button class="icon-btn" id="colorUndoBtn" title="되돌리기">↩️</button>
        <button class="icon-btn" id="backToDrawBtn" title="선 그리기로 돌아가기">🖍️</button>
      </div>

      <div class="topbar-group topbar-right">
        <button class="icon-btn" id="nextStepBtn" title="다음 단계 (길게 누르면 이전 단계)">➡️</button>
      </div>
    </div>

    <div class="work-main">
      <div class="canvas-wrap">
        <div id="canvasStage">
          <canvas id="fillCanvas"></canvas>
          <canvas id="lineArtCanvas"></canvas>
          <canvas id="decoCanvas"></canvas>
          <img id="guideImg" class="guideImg" alt="가이드">
          <canvas id="drawCanvas"></canvas>
          <div id="colorClickLayer"></div>
        </div>
        <div class="empty-theme-msg" id="emptyThemeMsg" style="display:none;">
          🙈 이 주제는 곧 추가될 예정이에요!<br>왼쪽 위 홈 버튼을 눌러 다른 주제를 선택해 주세요.
        </div>
      </div>
    </div>
  </section>

  <!-- 3. 완료 화면 -->
  <section id="screen-done" class="screen">
    <div class="done-card">
      <img id="doneThumb" alt="완성작">
      <p class="done-title">멋지게 완성했어요! 🎉</p>
      <p id="doneStatus" style="color:#6b8ea3;">제출 중이에요...</p>
      <div class="done-actions">
        <button class="btn ghost" id="redrawBtn">다시 그리기</button>
        <button class="btn coral" id="newCharBtn">다른 동물 그리기</button>
        <button class="btn ghost" id="miniGameBtn" disabled>🎮 두더지 잡기</button>
      </div>
    </div>
  </section>

  <!-- 4. 미니게임: 두더지 잡기 -->
  <section id="screen-game" class="screen">
    <div class="bubble-layer" id="bubbleLayer"></div>
    <div class="game-topbar">
      <div class="game-stat">🏆 <span id="gameScore">0</span>점</div>
      <div class="game-stat">⏱ <span id="gameTimer">30</span>초</div>
      <div class="game-stat">🔁 남은 기회 <span id="gameCredits">2</span></div>
    </div>
    <div class="countdown-popup" id="countdownPopup"><span id="countdownNum">10</span></div>
    <div class="mole-field">
      <div class="mole-grid" id="moleGrid"></div>
    </div>
    <div class="game-overlay" id="gameOverlay">
      <div class="game-overlay-card">
        <p class="game-overlay-title" id="gameOverlayTitle">두더지 잡기</p>
        <p class="game-overlay-desc" id="gameOverlayDesc">화면을 눌러 시작해요!</p>
        <div class="done-actions" id="gameOverlayActions"></div>
      </div>
    </div>
  </section>

</div>

<!-- 뽕망치 커서 (두더지 게임 전용) -->
<img id="hammerCursor" class="hammer-cursor" alt="" src="assets/ui/hammer.png">
<div id="hammerGlow" class="hammer-glow"></div>

<!-- 커스텀 모달 -->
<div id="modalOverlay">
  <div class="modal-box">
    <p class="modal-msg" id="modalMsg"></p>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- 로딩 오버레이 -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">처리 중이에요...</div>
</div>

<script src="assets/penguin/snap-data.js"></script>
<script src="assets/fish/snap-data.js"></script>
<script src="assets/gaori/snap-data.js"></script>
<script src="assets/crab/snap-data.js"></script>
<script src="assets/seahorse/snap-data.js"></script>
<script src="assets/shrimp/snap-data.js"></script>
<script src="guard.js"></script>
<script src="app.js"></script>
</body>
</html>
