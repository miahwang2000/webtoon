<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>웹툰 만들기 클래스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131316;
    --panel-white:#fbfaf6;
    --gutter:#1b1b22;
    --pop-red:#ef4056;
    --pop-yellow:#ffcf3f;
    --pop-blue:#3b6fe0;
    --muted:#8b8b95;
    --line:#131316;
    --success:#2fb676;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Gaegu','Poppins',system-ui,sans-serif;
    background:var(--gutter);
    color:var(--ink);
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  .display{font-family:'Black Han Sans', sans-serif; letter-spacing:.5px;}
  .screen{
    min-height:100vh;
    min-height:100dvh;
    display:none;
    flex-direction:column;
  }
  .screen.active{display:flex;}

  /* halftone texture */
  .halftone{
    background-image: radial-gradient(var(--ink) 1px, transparent 1.3px);
    background-size: 10px 10px;
    opacity:.06;
    position:absolute; inset:0; pointer-events:none;
  }

  /* ---------- START SCREEN ---------- */
  #screen-start{
    background:var(--pop-yellow);
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow:hidden;
  }
  .start-card{
    position:relative;
    background:var(--panel-white);
    border:4px solid var(--line);
    border-radius:20px;
    padding:32px 24px 28px;
    width:100%;
    max-width:380px;
    box-shadow:8px 8px 0 var(--ink);
  }
  .start-badge{
    position:absolute;
    top:-22px; left:50%;
    transform:translateX(-50%) rotate(-4deg);
    background:var(--pop-red);
    color:#fff;
    font-family:'Black Han Sans',sans-serif;
    padding:8px 18px;
    border:3px solid var(--line);
    border-radius:999px;
    font-size:15px;
    box-shadow:3px 3px 0 var(--ink);
  }
  .start-title{
    font-size:34px;
    text-align:center;
    margin:18px 0 4px;
    line-height:1.15;
  }
  .start-sub{
    text-align:center;
    color:var(--muted);
    font-size:15px;
    margin-bottom:22px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:6px;
  }
  .field select, .field input{
    width:100%;
    padding:12px 14px;
    border:3px solid var(--line);
    border-radius:10px;
    font-size:16px;
    font-family:inherit;
    background:#fff;
  }
  .field select:focus, .field input:focus{
    outline:3px solid var(--pop-blue);
    outline-offset:1px;
  }
  .btn{
    display:block;
    width:100%;
    border:3px solid var(--line);
    border-radius:12px;
    padding:14px;
    font-family:'Black Han Sans',sans-serif;
    font-size:18px;
    cursor:pointer;
    text-align:center;
    transition:transform .08s ease;
  }
  .btn:active{transform:translateY(2px);}
  .btn-primary{
    background:var(--pop-red);
    color:#fff;
    box-shadow:5px 5px 0 var(--ink);
    margin-top:8px;
  }
  .btn-primary:disabled{
    background:#c9c9ce; color:#fff; box-shadow:none; cursor:not-allowed;
  }
  .hint-error{
    color:var(--pop-red);
    font-size:13px;
    margin-top:8px;
    display:none;
    font-weight:700;
  }

  /* ---------- UPLOAD SCREEN ---------- */
  #screen-upload{background:var(--gutter);}
  .upload-header{
    padding:14px 16px 10px;
    color:#fff;
    display:flex; align-items:center; justify-content:space-between;
  }
  .upload-header .who{font-size:14px; opacity:.75;}
  .upload-header .title{font-family:'Black Han Sans',sans-serif; font-size:20px;}
  .upload-body{
    flex:1;
    display:flex;
    gap:12px;
    padding:0 12px 12px;
    overflow:hidden;
  }

  /* left: phone-frame live preview */
  .preview-pane{
    flex:1.1;
    background:var(--ink);
    border-radius:22px;
    border:4px solid #35353f;
    padding:10px;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .preview-pane .pane-label{
    color:var(--pop-yellow);
    font-family:'Black Han Sans',sans-serif;
    font-size:13px;
    margin-bottom:8px;
    padding-left:2px;
  }
  .preview-scroll{
    flex:1;
    background:#000;
    border-radius:14px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    display:flex;
    flex-direction:column;
  }
  .preview-scroll::-webkit-scrollbar{width:0;}
  .preview-empty{
    margin:auto;
    text-align:center;
    color:#6a6a75;
    font-size:14px;
    padding:20px;
    line-height:1.5;
  }
  .preview-page{
    width:100%;
    display:block;
    aspect-ratio:800/1280;
    object-fit:cover;
    border-bottom:1px solid #000;
  }

  /* right: slot list */
  .slot-pane{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
    overflow-y:auto;
    padding-right:2px;
    min-width:0;
  }
  .slot{
    background:var(--panel-white);
    border:3px solid var(--line);
    border-radius:12px;
    padding:8px;
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
  }
  .slot-num{
    width:26px; height:26px;
    background:var(--ink);
    color:#fff;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Black Han Sans',sans-serif;
    font-size:13px;
    flex-shrink:0;
  }
  .slot-thumb{
    width:44px;
    aspect-ratio:800/1280;
    border-radius:6px;
    border:2px dashed #c7c7cf;
    background:#f1f1ee;
    overflow:hidden;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    color:#b6b6bd;
  }
  .slot-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .slot-thumb.filled{border-style:solid; border-color:var(--line);}
  .slot-info{flex:1; min-width:0;}
  .slot-status{font-size:12px; font-weight:700;}
  .slot-status.empty{color:var(--muted);}
  .slot-status.uploading{color:var(--pop-blue);}
  .slot-status.done{color:var(--success);}
  .slot-status.error{color:var(--pop-red);}
  .slot-warn{font-size:11px; color:var(--pop-yellow); background:#3a3a20; padding:1px 6px; border-radius:6px; display:inline-block; margin-top:2px;}
  .slot-add{
    width:36px; height:36px;
    border-radius:50%;
    border:2px solid var(--line);
    background:var(--pop-blue);
    color:#fff;
    font-size:20px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    cursor:pointer;
  }
  .slot-add.replace{background:var(--panel-white); color:var(--ink);}

  .upload-footer{
    padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    background:var(--gutter);
  }
  .footer-hint{
    color:#a9a9b3;
    font-size:12px;
    text-align:center;
    margin-bottom:8px;
  }

  /* ---------- VIEWER SCREEN ---------- */
  #screen-viewer{
    background:#000;
    position:relative;
  }
  .viewer-scroll{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:none;
  }
  .viewer-scroll img{
    display:block;
    width:100%;
    aspect-ratio:800/1280;
    object-fit:cover;
  }
  .viewer-bar{
    position:fixed;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px calc(10px);
    padding-top:calc(10px + env(safe-area-inset-top));
    background:linear-gradient(rgba(0,0,0,.65), transparent);
    z-index:5;
    transition:opacity .2s ease;
  }
  .viewer-bar .vt{color:#fff; font-family:'Black Han Sans',sans-serif; font-size:15px;}
  .viewer-back{
    border:none;
    background:rgba(255,255,255,.15);
    color:#fff;
    padding:8px 14px;
    border-radius:20px;
    font-family:'Gaegu',sans-serif;
    font-weight:700;
    font-size:14px;
  }
  .viewer-end{
    color:#8b8b95;
    text-align:center;
    padding:36px 20px 60px;
    font-size:13px;
  }

  input[type=file]{display:none;}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
</style>
</head>
<body>

<!-- ============ 시작 화면 ============ -->
<section id="screen-start" class="screen active">
  <div class="halftone"></div>
  <div class="start-card">
    <div class="start-badge">WEBTOON CLASS</div>
    <h1 class="start-title display">웹툰 만들기<br>클래스</h1>
    <p class="start-sub">내 이름과 반을 선택하고<br>웹툰 그리기를 시작해요</p>

    <div class="field">
      <label for="in-school">학교</label>
      <select id="in-school">
        <option value="">학교 선택</option>
        <option value="신도림초">신도림초</option>
        <option value="등현초">등현초</option>
        <option value="신남초">신남초</option>
      </select>
    </div>
    <div class="field">
      <label for="in-class">반</label>
      <select id="in-class">
        <option value="">반 선택</option>
        <option value="A">A반</option>
        <option value="B">B반</option>
      </select>
    </div>
    <div class="field">
      <label for="in-name">이름</label>
      <input id="in-name" type="text" maxlength="10" placeholder="이름을 입력하세요" autocomplete="off">
    </div>

    <button id="btn-start" class="btn btn-primary display">수업 시작하기</button>
    <div id="start-error" class="hint-error">학교, 반, 이름을 모두 입력해주세요!</div>
  </div>
</section>

<!-- ============ 업로드 화면 ============ -->
<section id="screen-upload" class="screen">
  <div class="upload-header">
    <div>
      <div class="title display">웹툰 페이지 올리기</div>
      <div class="who" id="upload-who"></div>
    </div>
  </div>

  <div class="upload-body">
    <div class="preview-pane">
      <div class="pane-label">📱 미리보기</div>
      <div class="preview-scroll" id="preview-scroll">
        <div class="preview-empty" id="preview-empty">오른쪽에서<br>➕ 를 눌러<br>페이지를 추가해보세요</div>
      </div>
    </div>

    <div class="slot-pane" id="slot-pane"></div>
  </div>

  <div class="upload-footer">
    <div class="footer-hint">가로 800 × 세로 1280 픽셀 이미지 · 최대 5장</div>
    <button id="btn-finish" class="btn btn-primary display" disabled>웹툰으로 보기 🎬</button>
  </div>

  <input type="file" id="file-input" accept="image/*">
</section>

<!-- ============ 뷰어 화면 ============ -->
<section id="screen-viewer" class="screen">
  <div class="viewer-bar" id="viewer-bar">
    <span class="vt display">MY WEBTOON</span>
    <button class="viewer-back" id="btn-back-to-edit">✏️ 편집으로</button>
  </div>
  <div class="viewer-scroll" id="viewer-scroll"></div>
</section>

<script>
(function(){
  'use strict';

  // ---- Cloudinary 설정 ----
  var CLOUD_NAME = 'qmbonapf';
  var UPLOAD_PRESET = 'webtoon';
  var EXPECT_W = 800, EXPECT_H = 1280;
  var MAX_SLOTS = 5;

  var state = {
    school:'', className:'', studentName:'',
    slots: new Array(MAX_SLOTS).fill(null) // {file, localUrl, status, cloudUrl, warn}
  };
  var activeSlotIndex = null;

  function $(id){ return document.getElementById(id); }
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
    $(id).classList.add('active');
  }
  function sanitize(str){
    return (str||'').toString().trim().replace(/[^a-zA-Z0-9가-힣]/g,'_').slice(0,20) || 'unknown';
  }
  function requestKioskFullscreen(){
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(req){ try{ req.call(el); }catch(e){} }
  }

  // ---------- 시작 화면 ----------
  $('btn-start').addEventListener('click', function(){
    var school = $('in-school').value;
    var cls = $('in-class').value;
    var name = $('in-name').value.trim();
    if(!school || !cls || !name){
      $('start-error').style.display = 'block';
      return;
    }
    $('start-error').style.display = 'none';
    state.school = school; state.className = cls; state.studentName = name;
    $('upload-who').textContent = school + ' ' + cls + '반 · ' + name;
    requestKioskFullscreen();
    renderSlots();
    renderPreview();
    showScreen('screen-upload');
  });

  // ---------- 슬롯 렌더 ----------
  function renderSlots(){
    var pane = $('slot-pane');
    pane.innerHTML = '';
    for(var i=0; i<MAX_SLOTS; i++){
      var slot = state.slots[i];
      var row = document.createElement('div');
      row.className = 'slot';

      var num = document.createElement('div');
      num.className = 'slot-num';
      num.textContent = (i+1);
      row.appendChild(num);

      var thumb = document.createElement('div');
      thumb.className = 'slot-thumb' + (slot ? ' filled' : '');
      if(slot && slot.localUrl){
        var img = document.createElement('img');
        img.src = slot.localUrl;
        thumb.appendChild(img);
      } else {
        thumb.textContent = '+';
      }
      row.appendChild(thumb);

      var info = document.createElement('div');
      info.className = 'slot-info';
      var statusEl = document.createElement('div');
      statusEl.className = 'slot-status ' + (slot ? slot.status : 'empty');
      statusEl.textContent = !slot ? (i+1)+'번 페이지 비어있음'
        : slot.status === 'uploading' ? '저장 중...'
        : slot.status === 'done' ? '저장 완료'
        : slot.status === 'error' ? '저장 실패 (다시 눌러 재시도)'
        : '준비 중';
      info.appendChild(statusEl);
      if(slot && slot.warn){
        var warnEl = document.createElement('div');
        warnEl.className = 'slot-warn';
        warnEl.textContent = '⚠ 800×1280 아님';
        info.appendChild(warnEl);
      }
      row.appendChild(info);

      var addBtn = document.createElement('div');
      addBtn.className = 'slot-add' + (slot ? ' replace' : '');
      addBtn.textContent = slot ? '↻' : '+';
      addBtn.addEventListener('click', (function(idx){
        return function(){ openPicker(idx); };
      })(i));
      row.appendChild(addBtn);

      if(slot && slot.status === 'error'){
        row.addEventListener('click', (function(idx){
          return function(){ uploadToCloudinary(idx); };
        })(i));
      }

      pane.appendChild(row);
    }
    updateFinishButton();
  }

  function updateFinishButton(){
    var hasAny = state.slots.some(function(s){ return !!s; });
    $('btn-finish').disabled = !hasAny;
  }

  // ---------- 미리보기 렌더 ----------
  function renderPreview(){
    var scroll = $('preview-scroll');
    var filled = state.slots.filter(function(s){ return !!s; });
    if(filled.length === 0){
      scroll.innerHTML = '<div class="preview-empty" id="preview-empty">오른쪽에서<br>➕ 를 눌러<br>페이지를 추가해보세요</div>';
      return;
    }
    scroll.innerHTML = '';
    state.slots.forEach(function(s){
      if(!s) return;
      var img = document.createElement('img');
      img.className = 'preview-page';
      img.src = s.localUrl;
      scroll.appendChild(img);
    });
  }

  // ---------- 파일 선택 ----------
  var fileInput = $('file-input');
  function openPicker(idx){
    activeSlotIndex = idx;
    fileInput.value = '';
    fileInput.click();
  }
  fileInput.addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if(!file || activeSlotIndex === null) return;
    handleFileSelected(activeSlotIndex, file);
  });

  function handleFileSelected(idx, file){
    var localUrl = URL.createObjectURL(file);
    var slot = { file: file, localUrl: localUrl, status: 'uploading', cloudUrl: null, warn: false };
    state.slots[idx] = slot;
    renderSlots();
    renderPreview();

    var checkImg = new Image();
    checkImg.onload = function(){
      if(checkImg.naturalWidth !== EXPECT_W || checkImg.naturalHeight !== EXPECT_H){
        slot.warn = true;
        renderSlots();
      }
    };
    checkImg.src = localUrl;

    uploadToCloudinary(idx);
  }

  // ---------- Cloudinary 업로드 ----------
  function uploadToCloudinary(idx){
    var slot = state.slots[idx];
    if(!slot) return;
    slot.status = 'uploading';
    renderSlots();

    var publicId = 'webtoon_' + sanitize(state.className) + '_' + sanitize(state.studentName) +
      '_slot' + (idx+1) + '_' + Date.now();
    var formData = new FormData();
    formData.append('file', slot.file);
    formData.append('upload_preset', UPLOAD_PRESET);
    formData.append('public_id', publicId);

    fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', {
      method: 'POST',
      body: formData
    }).then(function(res){
      if(!res.ok) throw new Error('upload failed');
      return res.json();
    }).then(function(data){
      slot.status = 'done';
      slot.cloudUrl = data.secure_url;
      renderSlots();
    }).catch(function(){
      slot.status = 'error';
      renderSlots();
    });
  }

  // ---------- 뷰어로 전환 ----------
  $('btn-finish').addEventListener('click', function(){
    buildViewer();
    requestKioskFullscreen();
    showScreen('screen-viewer');
    $('viewer-scroll').scrollTop = 0;
  });

  function buildViewer(){
    var wrap = $('viewer-scroll');
    wrap.innerHTML = '';
    state.slots.forEach(function(s){
      if(!s) return;
      var img = document.createElement('img');
      img.src = s.localUrl;
      img.alt = '웹툰 페이지';
      wrap.appendChild(img);
    });
    var endMsg = document.createElement('div');
    endMsg.className = 'viewer-end';
    endMsg.textContent = '- 끝 -';
    wrap.appendChild(endMsg);
  }

  $('btn-back-to-edit').addEventListener('click', function(){
    showScreen('screen-upload');
  });

  // 스크롤 시 상단 바 살짝 숨기기
  var lastScroll = 0;
  $('viewer-scroll').addEventListener('scroll', function(){
    var bar = $('viewer-bar');
    var cur = this.scrollTop;
    if(cur > lastScroll && cur > 60){ bar.style.opacity = '0'; }
    else { bar.style.opacity = '1'; }
    lastScroll = cur;
  });

})();
</script>
</body>
</html>
